<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 206" width="300" height="206" role="img" aria-label="Une caisse tirée par une force F qui fait un angle α avec le déplacement AB : seule la partie de la force dans le sens du déplacement travaille, W = F × AB × cos α."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-dash-thin{fill: none; stroke: #98a2b3; stroke-width: 1; stroke-dasharray: 3 3;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><rect class="dg-t-sand" x="0" y="132" width="300" height="10"/><rect class="dg-t-grey" x="18" y="96" width="44" height="36" rx="4"/><rect class="dg-dash" x="218" y="96" width="44" height="36" rx="4"/><path class="dg-ink" d="M40 150L235.2 150"/><path class="dg-pt" d="M240 150L232.7 153.3L232.7 146.7Z"/><text class="dg-lbl-xs" x="140" y="162" text-anchor="middle" dominant-baseline="central">déplacement AB</text><path class="dg-vec" d="M40 114L112.7 72"/><path class="dg-vec-head" d="M117.9 69L112.1 77.1L108 70Z"/><path class="dg-dash-thin" d="M40 114L140 114"/><path class="dg-arc" d="M74 114A34 34 0 0 0 69.4 97"/><text class="dg-lbl-sm" x="84.4" y="102.1" text-anchor="middle" dominant-baseline="central">α</text><text class="dg-lbl-math" x="123.9" y="63" text-anchor="start" dominant-baseline="central">F</text><text class="dg-lbl-math" x="40" y="176" text-anchor="middle" dominant-baseline="central">A</text><text class="dg-lbl-math" x="240" y="176" text-anchor="middle" dominant-baseline="central">B</text><text class="dg-lbl-sm" x="150" y="196" text-anchor="middle" dominant-baseline="central">W = F × AB × cos α</text></svg>
