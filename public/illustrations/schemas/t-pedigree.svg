<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 190" width="300" height="190" role="img" aria-label="Arbre généalogique d’une famille : deux parents sains ont un fils malade ; l’allèle responsable de la maladie est donc récessif et les parents en sont porteurs."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-head-cell,.dg-cell,.dg-cell-hi{fill: #f5f7f9; stroke: #101828; stroke-width: 1;}.dg-cell{fill: #ffffff;}.dg-ill{fill: #101828; stroke: #101828; stroke-width: 1.4;}</style><rect class="dg-cell" x="90" y="20" width="20" height="20"/><circle class="dg-cell" cx="200" cy="30" r="10"/><path class="dg-ink" d="M110 30L190 30"/><path class="dg-ink" d="M150 30L150 70"/><path class="dg-ink" d="M80 70L220 70"/><path class="dg-ink" d="M80 70L80 90"/><path class="dg-ink" d="M150 70L150 90"/><path class="dg-ink" d="M220 70L220 90"/><circle class="dg-cell" cx="80" cy="100" r="10"/><rect class="dg-ill" x="140" y="90" width="20" height="20"/><circle class="dg-cell" cx="220" cy="100" r="10"/><text class="dg-lbl-sm" x="70" y="30" text-anchor="end" dominant-baseline="central">I</text><text class="dg-lbl-sm" x="50" y="100" text-anchor="end" dominant-baseline="central">II</text><rect class="dg-ill" x="20" y="140" width="14" height="14"/><text class="dg-lbl-xs" x="40" y="147" text-anchor="start" dominant-baseline="central">malade</text><rect class="dg-cell" x="110" y="140" width="14" height="14"/><text class="dg-lbl-xs" x="130" y="147" text-anchor="start" dominant-baseline="central">sain</text><text class="dg-lbl-xs" x="250" y="147" text-anchor="middle" dominant-baseline="central">carré : homme</text><text class="dg-lbl-xs" x="250" y="160" text-anchor="middle" dominant-baseline="central">rond : femme</text><text class="dg-lbl-xs" x="150" y="180" text-anchor="middle" dominant-baseline="central">parents sains, enfant malade : l’allèle de la maladie est récessif</text></svg>
