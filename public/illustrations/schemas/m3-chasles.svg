<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 192" width="300" height="192" role="img" aria-label="Relation de Chasles : aller de A à B puis de B à C revient à aller de A à C ; la somme des vecteurs AB et BC est le vecteur AC."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-pt{fill: #101828;}.dg-curve,.dg-curve-alt,.dg-curve-3{fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}</style><path class="dg-vec" d="M30 150L146 43.6"/><path class="dg-vec-head" d="M150 40L146.4 48.3L141.5 42.8Z"/><path class="dg-vec" d="M150 40L265.7 126.8"/><path class="dg-vec-head" d="M270 130L261.2 128L265.6 122.1Z"/><path class="dg-curve" d="M30 150L264 130.5"/><path class="dg-pt" d="M270 130L261.2 134.8L260.6 126.7Z"/><circle class="dg-pt" cx="30" cy="150" r="2.8"/><text class="dg-lbl-math" x="20" y="161" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="150" cy="40" r="2.8"/><text class="dg-lbl-math" x="150" y="28" text-anchor="middle" dominant-baseline="central">B</text><circle class="dg-pt" cx="270" cy="130" r="2.8"/><text class="dg-lbl-math" x="280" y="141" text-anchor="middle" dominant-baseline="central">C</text><text class="dg-lbl-sm" x="150" y="182" text-anchor="middle" dominant-baseline="central">vecteur AB + vecteur BC = vecteur AC</text></svg>
