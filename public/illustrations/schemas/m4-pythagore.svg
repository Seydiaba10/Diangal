<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 238" width="300" height="238" role="img" aria-label="Théorème de Pythagore : dans le triangle ABC rectangle en A (AB = 6 cm, AC = 8 cm), l’aire du carré construit sur l’hypoténuse (100) est la somme des aires des deux autres (36 + 64)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}</style><path class="dg-t-blue" d="M70 150L70 96L16 96L16 150Z"/><path class="dg-t-red" d="M70 150L142 150L142 222L70 222Z"/><path class="dg-t-yellow" d="M70 96L142 150L196 78L124 24Z"/><path class="dg-geo" d="M70 150L70 96L142 150Z"/><path class="dg-ink" d="M70 142L78 142L78 150"/><circle class="dg-pt" cx="70" cy="150" r="2.8"/><text class="dg-lbl-math" x="60" y="161" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="70" cy="96" r="2.8"/><text class="dg-lbl-math" x="60" y="86" text-anchor="middle" dominant-baseline="central">B</text><circle class="dg-pt" cx="142" cy="150" r="2.8"/><text class="dg-lbl-math" x="152" y="161" text-anchor="middle" dominant-baseline="central">C</text><text class="dg-lbl" x="43" y="123" text-anchor="middle" dominant-baseline="central">36</text><text class="dg-lbl" x="106" y="186" text-anchor="middle" dominant-baseline="central">64</text><text class="dg-lbl" x="143" y="93" text-anchor="middle" dominant-baseline="central">100</text><text class="dg-lbl-xs" x="10" y="230" text-anchor="start" dominant-baseline="central">AB = 6, AC = 8 : BC² = 36 + 64 = 100, BC = 10</text></svg>
