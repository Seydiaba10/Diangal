ral">tronc cérébral</text><text class="dg-lbl-xs" x="110" y="202" text-anchor="end" dominant-baseline="central">(bulbe)</text><path class="dg-leader" d="M168 208L211.5 214"/><circle class="dg-pt" cx="168" cy="208" r="1.8"/><text class="dg-lbl-xs" x="213.5" y="214" text-anchor="start" dominant-baseline="central">moelle épinière</text></svg>
