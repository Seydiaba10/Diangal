<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 320 92" width="320" height="92" role="img" aria-label="Un mètre partagé en 10 décimètres ; un décimètre est marqué."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-stick{fill: #fdef42; stroke: #101828; stroke-width: 1;}.dg-stick-alt{fill: #ffffff; stroke: #101828; stroke-width: 1;}.dg-axis{fill: currentColor; font-size: 12px; font-weight: 600;}.dg-line{fill: none; stroke: currentColor; stroke-width: 1.5;}.dg-text{fill: currentColor; font-size: 17px; font-weight: 600;}</style><rect class="dg-stick" x="10" y="40" width="30" height="20"/><rect class="dg-stick-alt" x="40" y="40" width="30" height="20"/><rect class="dg-stick" x="70" y="40" width="30" height="20"/><rect class="dg-stick-alt" x="100" y="40" width="30" height="20"/><rect class="dg-stick" x="130" y="40" width="30" height="20"/><rect class="dg-stick-alt" x="160" y="40" width="30" height="20"/><rect class="dg-stick" x="190" y="40" width="30" height="20"/><rect class="dg-stick-alt" x="220" y="40" width="30" height="20"/><rect class="dg-stick" x="250" y="40" width="30" height="20"/><rect class="dg-stick-alt" x="280" y="40" width="30" height="20"/><path class="dg-line" d="M10 30V34H310V30"/><text class="dg-text" x="160" y="18" text-anchor="middle" dominant-baseline="central">1 m = 10 dm = 100 cm</text><path class="dg-line" d="M10 66V70H40V66"/><text class="dg-axis" x="25" y="84" text-anchor="middle" dominant-baseline="central">1 dm</text></svg>
