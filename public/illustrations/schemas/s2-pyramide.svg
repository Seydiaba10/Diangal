<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 180" width="300" height="180" role="img" aria-label="Pyramide des niveaux d’un écosystème de savane : beaucoup de producteurs, moins d’herbivores, encore moins de carnivores ; l’énergie se perd d’un niveau à l’autre."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}</style><rect class="dg-t-green" x="30" y="120" width="240" height="34" rx="4"/><text class="dg-lbl-xs" x="150" y="137" text-anchor="middle" dominant-baseline="central">producteurs : herbe</text><rect class="dg-t-yellow" x="70" y="80" width="160" height="34" rx="4"/><text class="dg-lbl-xs" x="150" y="97" text-anchor="middle" dominant-baseline="central">consommateurs I : gazelle</text><rect class="dg-t-red" x="85" y="40" width="130" height="34" rx="4"/><text class="dg-lbl-xs" x="150" y="57" text-anchor="middle" dominant-baseline="central">consommateurs II : lion</text><path class="dg-ink" d="M282 140L282 52.2"/><path class="dg-pt" d="M282 48L284.9 54.4L279.1 54.4Z"/><text class="dg-lbl-xs" x="276" y="30" text-anchor="end" dominant-baseline="central">énergie</text><text class="dg-lbl-xs" x="276" y="42" text-anchor="end" dominant-baseline="central">qui diminue</text><text class="dg-lbl-xs" x="150" y="170" text-anchor="middle" dominant-baseline="central">à chaque niveau, une grande partie de l’énergie se perd</text></svg>
