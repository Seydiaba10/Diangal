<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 154" width="300" height="154" role="img" aria-label="Le bleu de bromothymol est jaune en milieu acide, vert en milieu neutre et bleu en milieu basique."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-bbt-yellow{fill: #fdef42;}.dg-bbt-green{fill: #12b76a;}.dg-bbt-blue{fill: #2e90fa;}.dg-glass,.dg-bottle{fill: none; stroke: #101828; stroke-width: 2; stroke-linejoin: round;}</style><path class="dg-glass" d="M46 20V110A14 14 0 0 0 74 110V20"/><rect class="dg-bbt-yellow" x="47" y="60" width="26" height="52"/><path class="dg-bbt-yellow" d="M47 112A13 13 0 0 0 73 112Z"/><text class="dg-lbl-xs" x="60" y="144" text-anchor="middle" dominant-baseline="central">acide : jaune</text><path class="dg-glass" d="M136 20V110A14 14 0 0 0 164 110V20"/><rect class="dg-bbt-green" x="137" y="60" width="26" height="52"/><path class="dg-bbt-green" d="M137 112A13 13 0 0 0 163 112Z"/><text class="dg-lbl-xs" x="150" y="144" text-anchor="middle" dominant-baseline="central">neutre : vert</text><path class="dg-glass" d="M226 20V110A14 14 0 0 0 254 110V20"/><rect class="dg-bbt-blue" x="227" y="60" width="26" height="52"/><path class="dg-bbt-blue" d="M227 112A13 13 0 0 0 253 112Z"/><text class="dg-lbl-xs" x="240" y="144" text-anchor="middle" dominant-baseline="central">basique : bleu</text><text class="dg-lbl-sm" x="150" y="12" text-anchor="middle" dominant-baseline="central">bleu de bromothymol (BBT)</text></svg>
