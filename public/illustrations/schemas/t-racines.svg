<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 214" width="300" height="214" role="img" aria-label="Les six racines sixièmes de l’unité, ω = e^(2ikπ/6), sont les sommets d’un hexagone régulier inscrit dans le cercle de centre O et de rayon 1."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-geo-fill{fill: #1d4ed8; opacity: 0.08; stroke: #101828; stroke-width: 1.8;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}</style><path class="dg-axis-line" d="M30 110L229.8 110"/><path class="dg-pt" d="M234 110L227.6 112.9L227.6 107.1Z"/><path class="dg-axis-line" d="M130 206L130 16.2"/><path class="dg-pt" d="M130 12L132.9 18.4L127.1 18.4Z"/><circle class="dg-dash" cx="130" cy="110" r="80"/><path class="dg-geo-fill" d="M210 110L170 40.7L90 40.7L50 110L90 179.3L170 179.3Z"/><circle class="dg-pt" cx="210" cy="110" r="2.8"/><text class="dg-lbl-math" x="220" y="121" text-anchor="middle" dominant-baseline="central">ω⁰</text><circle class="dg-pt" cx="170" cy="40.7" r="2.8"/><text class="dg-lbl-math" x="180" y="30.7" text-anchor="middle" dominant-baseline="central">ω¹</text><circle class="dg-pt" cx="90" cy="40.7" r="2.8"/><text class="dg-lbl-math" x="100" y="30.7" text-anchor="middle" dominant-baseline="central">ω²</text><circle class="dg-pt" cx="50" cy="110" r="2.8"/><text class="dg-lbl-math" x="40" y="121" text-anchor="middle" dominant-baseline="central">ω³</text><circle class="dg-pt" cx="90" cy="179.3" r="2.8"/><text class="dg-lbl-math" x="100" y="190.3" text-anchor="middle" dominant-baseline="central">ω⁴</text><circle class="dg-pt" cx="170" cy="179.3" r="2.8"/><text class="dg-lbl-math" x="180" y="190.3" text-anchor="middle" dominant-baseline="central">ω⁵</text><path class="dg-arc" d="M152 110A22 22 0 0 0 141 90.9"/><text class="dg-lbl-sm" x="162.9" y="91" text-anchor="middle" dominant-baseline="central">2π/6</text><text class="dg-tick" x="218" y="124" text-anchor="middle" dominant-baseline="central">1</text><text class="dg-lbl-xs" x="250" y="30" text-anchor="middle" dominant-baseline="central">zⁿ = 1 a n racines,</text><text class="dg-lbl-xs" x="250" y="44" text-anchor="middle" dominant-baseline="central">sommets d’un polygone</text><text class="dg-lbl-xs" x="250" y="58" text-anchor="middle" dominant-baseline="central">régulier (ici n = 6)</text></svg>
