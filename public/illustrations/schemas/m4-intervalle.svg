<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 94" width="300" height="94" role="img" aria-label="Droite graduée : l’intervalle [1 ; 4[ est colorié ; le crochet tourné vers l’intervalle en 1 montre que 1 est inclus, le crochet tourné vers l’extérieur en 4 montre que 4 est exclu."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-interval{fill: none; stroke: #e31b23; stroke-width: 6; opacity: 0.6;}.dg-bracket{fill: none; stroke: #e31b23; stroke-width: 2.5;}</style><path class="dg-axis-line" d="M14 50L287.8 50"/><path class="dg-pt" d="M292 50L285.6 52.9L285.6 47.1Z"/><path class="dg-axis-line" d="M30 46L30 54"/><text class="dg-tick" x="30" y="66" text-anchor="middle" dominant-baseline="central">−1</text><path class="dg-axis-line" d="M64.3 46L64.3 54"/><text class="dg-tick" x="64.3" y="66" text-anchor="middle" dominant-baseline="central">0</text><path class="dg-axis-line" d="M98.6 46L98.6 54"/><text class="dg-tick" x="98.6" y="66" text-anchor="middle" dominant-baseline="central">1</text><path class="dg-axis-line" d="M132.9 46L132.9 54"/><text class="dg-tick" x="132.9" y="66" text-anchor="middle" dominant-baseline="central">2</text><path class="dg-axis-line" d="M167.1 46L167.1 54"/><text class="dg-tick" x="167.1" y="66" text-anchor="middle" dominant-baseline="central">3</text><path class="dg-axis-line" d="M201.4 46L201.4 54"/><text class="dg-tick" x="201.4" y="66" text-anchor="middle" dominant-baseline="central">4</text><path class="dg-axis-line" d="M235.7 46L235.7 54"/><text class="dg-tick" x="235.7" y="66" text-anchor="middle" dominant-