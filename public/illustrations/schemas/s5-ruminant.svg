<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 214" width="300" height="214" role="img" aria-label="Estomac d’un ruminant à quatre poches : la panse, le bonnet, le feuillet et la caillette ; l’herbe avalée remonte dans la bouche pour être remâchée (rumination)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-blue-fill{fill: #2e90fa;}.dg-red-line,.dg-blue-line,.dg-green-line,.dg-yellow-line{fill: none; stroke: #f04438; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;}.dg-blue-line{stroke: #2e90fa;}</style><path class="dg-t-green" d="M40 70C40 40 70 30 110 34C150 38 160 60 158 92C156 130 130 150 96 150C60 150 40 120 40 70Z"/><text class="dg-lbl" x="96" y="102" text-anchor="middle" dominant-baseline="central">panse</text><path class="dg-t-yellow" d="M150 40C164 26 190 28 196 46C202 64 186 76 168 72C156 68 146 54 150 40Z"/><text class="dg-lbl-xs" x="174" y="52" text-anchor="middle" dominant-baseline="central">bonnet</text><circle class="dg-t-sand" cx="214" cy="96" r="22"/><text class="dg-lbl-xs" x="214" y="96" text-anchor="middle" dominant-baseline="central">feuillet</text><path class="dg-t-red" d="M232 112C262 116 282 138 274 160C266 178 236 176 216 162C20