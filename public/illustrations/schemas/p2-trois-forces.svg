<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 176" width="300" height="176" role="img" aria-label="Un objet suspendu par deux fils est en équilibre sous trois forces concourantes : les tensions T₁ et T₂ et le poids P. Mises bout à bout, elles forment un triangle fermé : leur somme est nulle."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><path class="dg-ink-thin" d="M20 40L90 110"/><path class="dg-ink-thin" d="M160 40L90 110"/><rect class="dg-pt" x="10" y="34" width="160" height="6"/><rect class="dg-t-grey" x="80" y="110" width="20" height="18" rx="3"/><path class="dg-vec" d="M90 110L63.8 83.8"/><path class="dg-vec-head" d="M60 80L68.4 83.2L63.2 88.4Z"/><text class="dg-lbl-math" x="63" y="95" text-anchor="middle" dominant-baseline="central">T₁</text><path class="dg-vec" d="M90 110L116.2 83.8"/><path class="dg-vec-head" d="M120 80L116.8 88.4L111.6 83.2Z"/><text class="dg-lbl-math" x="117" y="95" text-anchor="middle" dominant-baseline="central">T₂</text><path class="dg-vec" d="M90 110L90 164.6"/><path class="dg-vec-head" d="M90 170L86.3 161.8L93.7 161.8Z"/><text class="dg-lbl-math" x="102" y="140" text-anchor="middle" dominant-baseline="central">P</text><path class="dg-vec" d="M230 60L230 114.6"/><path class="dg-vec-head" d="M230 120L226.3 111.8L233.7 111.8Z"/><text class="dg-lbl-math" x="242" y="90" text-anchor="middle" dominant-baseline="central">P</text><path class="dg-vec" d="M230 120L203.8 93.8"/><path class="dg-vec-head" d="M200 90L208.4 93.2L203.2 98.4Z"/><text class="dg-lbl-math" x="203" y="105" text-anchor="middle" dominant-baseline="central">T₁</text><path class="dg-vec" d="M200 90L226.2 63.8"/><path class="dg-vec-head" d="M230 60L226.8 68.4L221.6 63.2Z"/><text class="dg-lbl-math" x="215" y="63" text-anchor="middle" dominant-baseline="central">T₂</text><text class="dg-lbl-xs" x="230" y="140" text-anchor="middle" dominant-baseline="central">triangle des forces fermé :</text><text class="dg-lbl-xs" x="230" y="152" text-anchor="middle" dominant-baseline="central">T₁ + T₂ + P = 0</text></svg>
