<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 182" width="300" height="182" role="img" aria-label="Les vecteurs AB et DC sont égaux (même direction, même sens, même longueur) : ABCD est un parallélogramme."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-geo-fill{fill: #1d4ed8; opacity: 0.08; stroke: #101828; stroke-width: 1.8;}</style><path class="dg-geo-fill" d="M30 140L170 140L260 50L120 50Z"/><path class="dg-vec" d="M30 140L164.6 140"/><path class="dg-vec-head" d="M170 140L161.8 143.7L161.8 136.3Z"/><path class="dg-vec" d="M120 50L254.6 50"/><path class="dg-vec-head" d="M260 50L251.8 53.7L251.8 46.3Z"/><circle class="dg-pt" cx="30" cy="140" r="2.8"/><text class="dg-lbl-math" x="20" y="151" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="170" cy="140" r="2.8"/><text class="dg-lbl-math" x="180" y="151" text-anchor="middle" dominant-baseline="central">B</text><circle class="dg-pt" cx="260" cy="50" r="2.8"/><text class="dg-lbl-math" x="270" y="40" text-anchor="middle" dominant-baseline="central">C</text><circle class="dg-pt" cx="120" cy="50" r="2.8"/><text class="dg-lbl-math" x="110" y="40" text-anchor="middle" dominant-baseline="central">D</text><text class="dg-lbl-xs" x="150" y="172" text-anchor="middle" dominant-baseline="central">vecteur AB = vecteur DC : ABCD est un parallélogramme</text></svg>
