<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 218" width="300" height="218" role="img" aria-label="Datation relative : les couches A, B, C et D se sont déposées dans cet ordre (superposition) ; la faille F coupe A, B et C mais pas D, elle est donc plus récente que C et plus ancienne que D ; la roche M recoupe A et B, elle leur est postérieure."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-t-pink{fill: #fff4ed; stroke: #f97316;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}.dg-fault{fill: none; stroke: #101828; stroke-width: 2.5; stroke-dasharray: 8 4;}.dg-magma,.dg-lava{fill: #f97316; stroke: #b42318; stroke-width: 1;}</style><rect class="dg-t-yellow" x="40" y="10" width="220" height="36"/><text class="dg-lbl" x="50" y="28" text-anchor="start" dominant-baseline="central">D</text><rect class="dg-t-sand" x="40" y="46" width="220" height="36"/><text class="dg-lbl" x="50" y="64" text-anchor="start" dominant-baseline="central">C</text><rect class="dg-t-pink" x="40" y="82" width="220" height="36"/><text class="dg-lbl" x="50" y="100" text-anchor="start" dominant-baseline="central">B</text><rect class="dg-t-grey" x="40" y="118" width="220" height="36"/><text class="dg-lbl" x="50" y="136" text-anchor="start" dominant-baseline="central">A</text><path class="dg-fault" d="M190 154L160 46"/><text class="dg-lbl-math" x="196" y="140" text-anchor="start" dominant-baseline="central">F</text><path class="dg-magma" d="M84 154C94 130 104 110 100 82C114 100 120 130 124 154Z"/><text class="dg-lbl" x="108" y="138" text-anchor="middle" dominant-baseline="central">M</text><text class="dg-lbl-xs" x="150" y="170" text-anchor="middle" dominant-baseline="central">Superposition : A s’est déposée en premier, D en dernier.</text><text class="dg-lbl-xs" x="150" y="183" text-anchor="middle" dominant-baseline="central">La faille F coupe A, B et C, mais pas D :</text><text class="dg-lbl-xs" x="150" y="196" text-anchor="middle" dominant-baseline="central">elle est plus récente que C et plus ancienne que D.</text><text class="dg-lbl-xs" x="150" y="209" text-anchor="middle" dominant-baseline="central">La roche M recoupe A et B : elle leur est postérieure.</text></svg>
