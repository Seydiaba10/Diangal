<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 176" width="300" height="176" role="img" aria-label="Un écosystème réunit un biotope (le milieu physique : sol, eau, climat, lumière) et une biocénose (les êtres vivants), qui agissent l’un sur l’autre."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}</style><rect class="dg-t-sand" x="10" y="20" width="130" height="110" rx="12"/><text class="dg-lbl-sm" x="75" y="36" text-anchor="middle" dominant-baseline="central">biotope</text><text class="dg-lbl-xs" x="75" y="58" text-anchor="middle" dominant-baseline="central">sol</text><text class="dg-lbl-xs" x="75" y="74" text-anchor="middle" dominant-baseline="central">eau</text><text class="dg-lbl-xs" x="75" y="90" text-anchor="middle" dominant-baseline="central">climat</text><text class="dg-lbl-xs" x="75" y="106" text-anchor="middle" dominant-baseline="central">lumière</text><rect class="dg-t-green" x="160" y="20" width="130" height="110" rx="12"/><text class="dg-lbl-sm" x="225" y="36" text-anchor="middle" dominant-baseline="central">biocénose</text><text class="dg-lbl-xs" x="225" y="58" text-anchor="middle" dominant-baseline="central">plantes</text><text class="dg-lbl-xs" x="225" y="74" text-anchor="middle" dominant-baseline="central">animaux</text><text class="dg-lbl-xs" x="225" y="90" text-anchor="middle" dominant-baseline="central">champignons</text><text class="dg-lbl-xs" x="225" y="106" text-anchor="middle" dominant-baseline="central">bactéries</text><path class="dg-ink" d="M140 64L155.8 64"/><path class="dg-pt" d="M160 64L153.6 66.9L153.6 61.1Z"/><path class="dg-ink" d="M160 90L144.2 90"/><path class="dg-pt" d="M140 90L146.4 87.1L146.4 92.9Z"/><text class="dg-lbl-sm" x="150" y="148" text-anchor="middle" dominant-baseline="central">écosystème = biotope + biocénose</text><text class="dg-lbl-xs" x="150" y="166" text-anchor="middle" dominant-baseline="central">exemple : la mangrove du Saloum</text></svg>
