<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 196" width="300" height="196" role="img" aria-label="Un solide suspendu à un fil est en équilibre sous deux forces : la tension du fil, vers le haut, et son poids, vers le bas ; elles ont la même droite d’action et la même intensité."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><rect class="dg-pt" x="110" y="10" width="80" height="10"/><path class="dg-ink" d="M150 20L150 90"/><rect class="dg-t-grey" x="126" y="90" width="48" height="40" rx="4"/><text class="dg-lbl" x="150" y="110" text-anchor="middle" dominant-baseline="central">S</text><path class="dg-vec" d="M150 90L150 46"/><path class="dg-vec-head" d="M150 40L154.1 49.1L145.9 49.1Z"/><text class="dg-lbl-xs" x="160" y="52" text-anchor="start" dominant-baseline="central">T (tension du fil)</text><path class="dg-vec" d="M150 112L150 160"/><path class="dg-vec-head" d="M150 166L145.9 156.9L154.1 156.9Z"/><text class="dg-lbl-xs" x="160" y="160" text-anchor="start" dominant-baseline="central">P (poids)</text><text class="dg-lbl-xs" x="150" y="186" text-anchor="middle" dominant-baseline="central">même droite d’action, sens contraires, T = P</text></svg>
