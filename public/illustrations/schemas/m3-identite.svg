<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 224" width="300" height="224" role="img" aria-label="Un carré de côté a + b se découpe en un carré a², un carré b² et deux rectangles ab : (a + b)² = a² + 2ab + b²."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}</style><rect class="dg-t-blue" x="60" y="16" width="110" height="110"/><rect class="dg-t-yellow" x="170" y="16" width="60" height="110"/><rect class="dg-t-yellow" x="60" y="126" width="110" height="60"/><rect class="dg-t-red" x="170" y="126" width="60" height="60"/><text class="dg-lbl" x="115" y="71" text-anchor="middle" dominant-baseline="central">a²</text><text class="dg-lbl" x="200" y="71" text-anchor="middle" dominant-baseline="central">ab</text><text class="dg-lbl" x="115" y="156" text-anchor="middle" dominant-baseline="central">ab</text><text class="dg-lbl" x="200" y="156" text-anchor="middle" dominant-baseline="central">b²</text><text class="dg-lbl-math" x="115" y="198" text-anchor="middle" dominant-baseline="central">a</text><text class="dg-lbl-math" x="200" y="198" text-anchor="middle" dominant-baseline="central">b</text><text class="dg-lbl-math" x="50" y="71" text-anchor="middle" dominant-baseline="central">a</text><text class="dg-lbl-math" x="50" y="156" text-anchor="middle" dominant-baseline="central">b</text><text class="dg-lbl-sm" x="150" y="214" text-anchor="middle" dominant-baseline="central">(a + b)² = a² + 2ab + b²</text></svg>
