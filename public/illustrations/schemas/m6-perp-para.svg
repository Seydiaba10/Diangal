<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 174" width="300" height="174" role="img" aria-label="À gauche, deux droites perpendiculaires (d) et (d′) avec le codage de l’angle droit. À droite, deux droites parallèles (d₁) et (d₂) ; la droite (Δ) perpendiculaire à l’une est perpendiculaire à l’autre."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-geo-line{stroke: #1d4ed8; stroke-width: 1.4;}</style><path class="dg-geo" d="M17.6 105.4L126.4 54.6"/><path class="dg-geo-line" d="M97.4 134.4L46.6 25.6"/><path class="dg-ink" d="M82 75.4L77.3 65.4L67.4 70"/><text class="dg-lbl-math" x="130.4" y="46.6" text-anchor="middle" dominant-baseline="central">(d)</text><text class="dg-lbl-math" x="34.6" y="29.6" text-anchor="middle" dominant-baseline="central">(d′)</text><text class="dg-lbl" x="72" y="160" text-anchor="middle" dominant-baseline="central">(d) ⊥ (d′)</text><path class="dg-geo" d="M170 50L292 50"/><path class="dg-geo" d="M170 110L292 110"/><path class="dg-geo-line" d="M232 26L232 134"/><path class="dg-ink" d="M241 50L241 41L232 41"/><path class="dg-ink" d="M241 110L241 119L232 119"/><text class="dg-lbl-math" x="176" y="38" text-anchor="start" dominant-baseline="central">(d₁)</text><text class="dg-lbl-math" x="176" y="98" text-anchor="start" dominant-baseline="central">(d₂)</text><text class="dg-lbl-math" x="244" y="30" text-anchor="start" dominant-baseline="central">(Δ)</text><text class="dg-lbl" x="231" y="160" text-anchor="middle" dominant-baseline="central">(d₁) // (d₂)</text></svg>
