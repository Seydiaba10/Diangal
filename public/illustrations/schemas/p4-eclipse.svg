<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 138" width="300" height="138" role="img" aria-label="Éclipse de Lune (schéma, tailles et distances non respectées) : le Soleil, la Terre et la Lune sont alignés ; la Lune entre dans l’ombre de la Terre."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}.dg-shadow{fill: #101828; opacity: 0.22;}.dg-ray-zone{fill: #fffaeb;}</style><circle class="dg-t-yellow" cx="30" cy="70" r="24"/><text class="dg-lbl-xs" x="30" y="112" text-anchor="middle" dominant-baseline="central">Soleil</text><path class="dg-ray-zone" d="M30 46L270 62V78L30 94Z"/><circle class="dg-t-blue" cx="170" cy="70" r="18"/><text class="dg-lbl-xs" x="170" y="104" text-anchor="middle" dominant-baseline="central">Terre</text><path class="dg-shadow" d="M170 52L280 66V74L170 88Z"/><circle class="dg-t-grey" cx="250" cy="70" r="7"/><text class="dg-lbl-xs" x="250" y="92" text-anchor="middle" dominant-baseline="central">Lune</text><text class="dg-lbl-xs" x="150" y="128" text-anchor="middle" dominant-baseline="central">éclipse de Lune : la Lune passe dans l’ombre de la Terre</text></svg>
