<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="L’angle inscrit AMB intercepte le même arc AB que l’angle au centre AOB : il mesure la moitié, 50° pour 100°."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-pt{fill: #101828;}.dg-curve,.dg-curve-alt,.dg-curve-3{fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}.dg-arc-2{fill: none; stroke: #12b76a; stroke-width: 1.8;}.dg-arc-thick{fill: none; stroke: #e31b23; stroke-width: 4;}</style><circle class="dg-geo" cx="110" cy="104" r="84"/><path class="dg-geo" d="M110 104L174.3 158"/><path class="dg-geo" d="M110 104L45.7 158"/><path class="dg-curve" d="M88.3 22.9L174.3 158"/><path class="dg-curve" d="M88.3 22.9L45.7 158"/><path class="dg-arc-thick" d="M45.65226677800585 157.99415921366932A84 84 0 0 0 174.34773322199413 157.9941592136693"/><path class="dg-arc" d="M125.3 116.9A20 20 0 0 1 94.7 116.9"/><text class="dg-lbl-sm" x="110" y="138" text-anchor="middle" dominant-baseline="central">100°</text><path class="dg-arc-2" d="M104.4 48.2A30 30 0 0 1 79.2 51.5"/><text class="dg-lbl-sm" x="94" y="66.5" text-anchor="middle" dominant-baseline="central">50°</text><circle class="dg-pt" cx="110" cy="104" r="2.8"/><text class="dg-lbl-math" x="122" y="104" text-anchor="middle" dominant-baseline="central">O</text><circle class="dg-pt" cx="174.3" cy="158" r="2.8"/><text class="dg-lbl-math" x="184.3" y="169" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="45.7" cy="158" r="2.8"/><text class="dg-lbl-math" x="35.7" y="169" text-anchor="middle" dominant-baseline="central">B</text><circle class="dg-pt" cx="88.3" cy="22.9" r="2.8"/><text class="dg-lbl-math" x="88.3" y="10.9" text-anchor="middle" dominant-baseline="central">M</text><text class="dg-lbl-xs" x="250" y="90" text-anchor="middle" dominant-baseline="central">angle au centre :</text><text class="dg-lbl-xs" x="250" y="102" text-anchor="middle" dominant-baseline="central">AÔB = 100°</text><text class="dg-lbl-xs" x="250" y="126" text-anchor="middle" dominant-baseline="central">angle inscrit :</text><text class="dg-lbl-xs" x="250" y="138" text-anchor="middle" dominant-baseline="central">AM̂B = 50°</text></svg>
