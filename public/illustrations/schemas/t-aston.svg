<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Énergie de liaison par nucléon selon le nombre de masse A : maximale vers le fer 56 (environ 8,8 MeV), les noyaux les plus stables ; les noyaux légers libèrent de l’énergie en fusionnant, les lourds en se cassant (fission)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-curve,.dg-curve-alt,.dg-curve-3{fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}</style><path class="dg-axis-line" d="M24 190L297.8 190"/><path class="dg-pt" d="M302 190L295.6 192.9L295.6 187.1Z"/><path class="dg-axis-line" d="M30 196L30 22.2"/><path class="dg-pt" d="M30 18L32.9 24.4L27.1 24.4Z"/><path class="dg-axis-line" d="M82 187L82 193"/><text class="dg-tick" x="82" y="201" text-anchor="middle" dominant-baseline="central">50</text><path class="dg-axis-line" d="M134 187L134 193"/><text class="dg-tick" x="134" y="201" text-anchor="middle" dominant-baseline="central">100</text><path class="dg-axis-line" d="M186 187L186 193"/><text class="dg-tick" x="186" y="201" text-anchor="middle" dominant-baseline="central">150</text><path class="dg-axis-line" d="M238 187L238 193"/><text class="dg-tick" x="238" y="201" text-anchor="middle" dominant-baseline="central">200</text><path class="dg-axis-line" d="M27 158L33 158"/><text class="dg-tick" x="24" y="158" text-anchor="end" dominant-baseline="central">2</text><path class="dg-axis-line" d="M27 126L33 126"/><text class="dg-tick" x="24" y="126" text-anchor="end" dominant-baseline="central">4</text><path class="dg-axis-line" d="M27 94L33 94"/><text class="dg-tick" x="24" y="94" text-anchor="end" dominant-baseline="central">6</text><path class="dg-axis-line" d="M27 62L33 62"/><text class="dg-tick" x="24" y="62" text-anchor="end" dominant-baseline="central">8</text><text class="dg-tick" x="22" y="200" text-anchor="middle" dominant-baseline="central">O</text><text class="dg-lbl-math" x="300" y="179" text-anchor="end" dominant-baseline="central">A</text><text class="dg-lbl-math" x="38" y="22" text-anchor="start" dominant-baseline="central">Eℓ/A (MeV)</text><path class="dg-curve" d="M32.1 172.2L34.2 76.9L36.2 104.7L42.5 67.1L46.6 62.3L88.2 49.4L154.8 53.8L277.5 68.9"/><circle class="dg-pt" cx="32.1" cy="172.2" r="3.2"/><text class="dg-lbl-math" x="46.1" y="163.2" text-anchor="middle" dominant-baseline="central">²H</text><circle class="dg-pt" cx="34.2" cy="76.9" r="3.2"/><text class="dg-lbl-math" x="48.2" y="80.9" text-anchor="middle" dominant-baseline="central">⁴He</text><circle class="dg-pt" cx="36.2" cy="104.7" r="3.2"/><circle class="dg-pt" cx="42.5" cy="67.1" r="3.2"/><circle class="dg-pt" cx="46.6" cy="62.3" r="3.2"/><circle class="dg-pt" cx="88.2" cy="49.4" r="3.2"/><text class="dg-lbl-math" x="96.2" y="40.4" text-anchor="middle" dominant-baseline="central">⁵⁶Fe</text><circle class="dg-pt" cx="154.8" cy="53.8" r="3.2"/><circle class="dg-pt" cx="277.5" cy="68.9" r="3.2"/><text class="dg-lbl-math" x="271.5" y="59.9" text-anchor="middle" dominant-baseline="central">²³⁸U</text><text class="dg-lbl-xs" x="50.8" y="41.2" text-anchor="middle" dominant-baseline="central">fusion →</text><text class="dg-lbl-xs" x="238" y="41.2" text-anchor="middle" dominant-baseline="central">← fission</text></svg>
