<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 206" width="300" height="206" role="img" aria-label="Un sarcomère, unité du muscle strié, relâché puis contracté : les filaments fins d’actine glissent entre les filaments épais de myosine ; les stries Z se rapprochent et le sarcomère raccourcit."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-zline{fill: none; stroke: #101828; stroke-width: 3;}.dg-actin,.dg-myosin{fill: none; stroke: #2e90fa; stroke-width: 2;}.dg-myosin{stroke: #f04438; stroke-width: 5;}</style><path class="dg-zline" d="M40 20L40 72"/><path class="dg-zline" d="M260 20L260 72"/><path class="dg-actin" d="M40 26L140 26"/><path class="dg-actin" d="M160 26L260 26"/><path class="dg-myosin" d="M90 34L210 34"/><path class="dg-actin" d="M40 42L140 42"/><path class="dg-actin" d="M160 42L260 42"/><path class="dg-myosin" d="M90 50L210 50"/><path class="dg-actin" d="M40 58L140 58"/><path class="dg-actin" d="M160 58L260 58"/><path class="dg-myosin" d="M90 66L210 66"/><text class="dg-lbl-xs" x="150" y="86" text-anchor="middle" dominant-baseline="central">relâché</text><path class="dg-zline" d="M74 124L74 176"/><path class="dg-zline" d="M226 124L226 176"/><path class="dg-actin" d="M74 130L140 130"/><path class="dg-actin" d="M160 130L226 130"/><path class="dg-myosin" d="M90 138L210 138"/><path class="dg-actin" d="M74 146L140 146"/><path class="dg-actin" d="M160 146L226 146"/><path class="dg-myosin" d="M90 154L210 154"/><path class="dg-actin" d="M74 162L140 162"/><path class="dg-actin" d="M160 162L226 162"/><path class="dg-myosin" d="M90 170L210 170"/><text class="dg-lbl-xs" x="150" y="190" text-anchor="middle" dominant-baseline="central">contracté : les filaments glissent, la strie Z se rapproche</text><path class="dg-leader" d="M60 30L44.5 14"/><circle class="dg-pt" cx="60" cy="30" r="1.8"/><text class="dg-lbl-xs" x="42.5" y="14" text-anchor="end" dominant-baseline="central">strie Z</text><text class="dg-lbl-xs" x="286" y="26" text-anchor="end" dominant-baseline="central">actine (fine)</text><text class="dg-lbl-xs" x="286" y="82" text-anchor="end" dominant-baseline="central">myosine (épaisse)</text></svg>
