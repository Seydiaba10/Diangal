<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 194" width="300" height="194" role="img" aria-label="Modèle de l’atome de sodium (Z = 11) : un noyau et 11 électrons répartis sur trois couches, 2 sur K, 8 sur L et 1 sur M (schéma, tailles non respectées)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-blue-fill{fill: #2e90fa;}.dg-shell{fill: none; stroke: #98a2b3; stroke-width: 1; stroke-dasharray: 3 3;}</style><circle class="dg-shell" cx="96" cy="100" r="82"/><circle class="dg-shell" cx="96" cy="100" r="58"/><circle class="dg-shell" cx="96" cy="100" r="34"/><circle class="dg-t-red" cx="96" cy="100" r="14"/><text class="dg-lbl-xs" x="96" y="100" text-anchor="middle" dominant-baseline="central">noyau</text><circle class="dg-blue-fill" cx="96" cy="66" r="4"/><circle class="dg-blue-fill" cx="96" cy="134" r="4"/><circle class="dg-blue-fill" cx="149.6" cy="77.8" r="4"/><circle class="dg-blue-fill" cx="118.2" cy="46.4" r="4"/><circle class="dg-blue-fill" cx="73.8" cy="46.4" r="4"/><circle class="dg-blue-fill" cx="42.4" cy="77.8" r="4"/><circle class="dg-blue-fill" cx="42.4" cy="122.2" r="4"/><circle class="dg-blue-fill" cx="73.8" cy="153.6" r="4"/><circle class="dg-blue-fill" cx="118.2" cy="153.6" r="4"/><circle class="dg-blue-fill" cx="149.6" cy="122.2" r="4"/><circle class="dg-blue-fill" cx="154" cy="42" r="4"/><text class="dg-lbl-xs" x="134" y="108" text-anchor="start" dominant-baseline="central">K</text><text class="dg-lbl-xs" x="158" y="108" text-anchor="start" dominant-baseline="central">L</text><text class="dg-lbl-xs" x="182" y="108" text-anchor="start" dominant-baseline="central">M</text><text class="dg-lbl-xs" x="196" y="40" text-anchor="start" dominant-baseline="central">sodium Na (Z = 11)</text><text class="dg-lbl-xs" x="196" y="60" text-anchor="start" dominant-baseline="central">11 protons,</text><text class="dg-lbl-xs" x="196" y="72" text-anchor="start" dominant-baseline="central">12 neutrons</text><text class="dg-lbl-xs" x="196" y="92" text-anchor="start" dominant-baseline="central">11 électrons :</text><text class="dg-lbl-sm" x="196" y="106" text-anchor="start" dominant-baseline="central">K² L⁸ M¹</text></svg>
