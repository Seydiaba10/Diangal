ck" x="238" y="201" text-anchor="middle" dominant-baseline="central">0,06</text><path class="dg-axis-line" d="M19 166L25 166"/><text class="dg-tick" x="16" y="166" text-anchor="end" dominant-baseline="central">1</text><path class="dg-axis-line" d="M19 142L25 142"/><text class="dg-tick" x="16" y="142" text-anchor="end" dominant-baseline="central">2</text><path class="dg-axis-line" d="M19 118L25 118"/><text class="dg-tick" x="16" y="118" text-anchor="end" dominant-baseline="central">3</text><path class="dg-axis-line" d="M19 94L25 94"/><text class="dg-tick" x="16" y="94" text-anchor="end" dominant-baseline="central">4</text><path class="dg-axis-line" d="M19 70L25 70"/><text class="dg-tick" x="16" y="70" text-anchor="end" dominant-baseline="central">5</text><path class="dg-axis-line" d="M19 46L25 46"/><text class="dg-tick" x="16" y="46" text-anchor="end" dominant-baseline="central">6</text><text class="dg-tick" x="14" y="200" text-anchor="middle" dominant-baseline="central">O</text><text class="dg-lbl-math" x="284" y="179" text-anchor="end" dominant-baseline="central">I (A)</text><text class="dg-lbl-math" x="30" y="14" text-anchor="start" dominant-baseline="central">U (V)</text><path class="dg-curve" d="M22 190L274 22"/><path class="dg-dash-thin" d="M202 70L202 190"/><path class="dg-dash-thin" d="M202 70L22 70"/><circle class="dg-pt" cx="202" cy="70" r="3.2"/><text class="dg-lbl-sm" x="209.2" y="84.4" text-anchor="start" dominant-baseline="central">U = 100 × I</text></svg>
