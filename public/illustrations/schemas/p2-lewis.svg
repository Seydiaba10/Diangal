<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 112" width="300" height="112" role="img" aria-label="À gauche, la molécule d’eau en représentation de Lewis : deux liaisons covalentes O–H et deux doublets non liants sur l’oxygène. À droite, la liaison ionique du sel : le sodium cède un électron au chlore."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-formula{fill: currentColor; font-size: 13px; font-weight: 700;}</style><text class="dg-formula" x="40" y="50" text-anchor="middle" dominant-baseline="central">H</text><text class="dg-formula" x="80" y="50" text-anchor="middle" dominant-baseline="central">O</text><text class="dg-formula" x="120" y="50" text-anchor="middle" dominant-baseline="central">H</text><path class="dg-ink" d="M48 50L72 50"/><path class="dg-ink" d="M88 50L112 50"/><path class="dg-ink" d="M74 36L86 36"/><path class="dg-ink" d="M74 64L86 64"/><text class="dg-lbl-xs" x="80" y="88" text-anchor="middle" dominant-baseline="central">eau : 2 liaisons covalentes,</text><text class="dg-lbl-xs" x="80" y="100" text-anchor="middle" dominant-baseline="central">2 doublets non liants sur O</text><text class="dg-formula" x="180" y="34" text-anchor="middle" dominant-baseline="central">Na</text><path class="dg-ink" d="M196 34L231.8 34"/><path class="dg-pt" d="M236 34L229.6 36.9L229.6 31.1Z"/><text class="dg-formula" x="244" y="34" text-anchor="start" dominant-baseline="central">Na⁺ + e⁻</text><text class="dg-formula" x="180" y="66" text-anchor="middle" dominant-baseline="central">Cl + e⁻</text><path class="dg-ink" d="M204 66L231.8 66"/><path class="dg-pt" d="M236 66L229.6 68.9L229.6 63.1Z"/><text class="dg-formula" x="244" y="66" text-anchor="start" dominant-baseline="central">Cl⁻</text><text class="dg-lbl-xs" x="220" y="100" text-anchor="middle" dominant-baseline="central">sel : ions Na⁺ et Cl⁻ qui s’attirent</text></svg>
