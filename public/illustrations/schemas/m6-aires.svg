<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 124" width="300" height="124" role="img" aria-label="Aires : rectangle (L × l), triangle (base × hauteur ÷ 2, la hauteur est perpendiculaire à la base), disque (π × r × r)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-geo-fill{fill: #1d4ed8; opacity: 0.08; stroke: #101828; stroke-width: 1.8;}</style><rect class="dg-geo-fill" x="12" y="26" width="96" height="56"/><text class="dg-lbl-math" x="60" y="92" text-anchor="middle" dominant-baseline="central">L</text><text class="dg-lbl-math" x="118" y="54" text-anchor="middle" dominant-baseline="central">l</text><text class="dg-lbl-sm" x="60" y="112" text-anchor="middle" dominant-baseline="central">A = L × l</text><path class="dg-geo-fill" d="M134 82L214 82L168 22Z"/><path class="dg-dash" d="M168 22L168 82"/><path class="dg-ink" d="M175 82L175 75L168 75"/><text class="dg-lbl-math" x="176" y="54" text-anchor="middle" dominant-baseline="central">h</text><text class="dg-lbl-math" x="174" y="92" text-anchor="middle" dominant-baseline="central">b</text><text class="dg-lbl-sm" x="174" y="112" text-anchor="middle" dominant-baseline="central">A = b × h ÷ 2</text><circle class="dg-geo-fill" cx="262" cy="54" r="30"/><path class="dg-vec" d="M262 54L292 54"/><circle class="dg-pt" cx="262" cy="54" r="2.5"/><text class="dg-lbl-math" x="277" y="46" text-anchor="middle" dominant-baseline="central">r</text><text class="dg-lbl-sm" x="262" y="112" text-anchor="middle" dominant-baseline="central">A = π × r × r</text></svg>
