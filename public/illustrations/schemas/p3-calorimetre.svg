<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 208" width="300" height="208" role="img" aria-label="Un calorimètre, récipient isolé avec thermomètre et agitateur : en y mélangeant 200 g d’eau à 80 °C et 300 g d’eau à 20 °C, on obtient une température d’équilibre de 44 °C."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-water{fill: #2e90fa; opacity: 0.55;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-head-cell,.dg-cell,.dg-cell-hi{fill: #f5f7f9; stroke: #101828; stroke-width: 1;}.dg-cell{fill: #ffffff;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}.dg-red-fill{fill: #f04438;}</style><rect class="dg-t-grey" x="80" y="40" width="140" height="140" rx="8"/><rect class="dg-cell" x="96" y="54" width="108" height="120" rx="4"/><rect class="dg-water" x="100" y="100" width="100" height="70"/><rect class="dg-pt" x="84" y="30" width="132" height="12" rx="3"/><path class="dg-ink" d="M130 14L130 150"/><circle class="dg-red-fill" cx="130" cy="150" r="4"/><path class="dg-ink-thin" d="M170 14V140h-12"/><path class="dg-leader" d="M88 60L83 50"/><circle class="dg-pt" cx="88" cy="60" r="1.8"/><text class="dg-lbl-xs" x="81" y="50" text-anchor="end" dominant-baseline="central">paroi isolante</text><path class="dg-leader" d="M130 30L66.5 14"/><circle class="dg-pt" cx="130" cy="30" r="1.8"/><text class="dg-lbl-xs" x="64.5" y="14" text-anchor="end" dominant-baseline="central">thermomètre</text><path class="dg-leader" d="M170 60L244.5 40"/><circle class="dg-pt" cx="170" cy="60" r="1.8"/><text class="dg-lbl-xs" x="246.5" y="40" text-anchor="start" dominant-baseline="central">agitateur</text><path class="dg-leader" d="M150 140L206 150"/><circle class="dg-pt" cx="150" cy="140" r="1.8"/><text class="dg-lbl-xs" x="208" y="144" text-anchor="start" dominant-baseline="central">mélange d’eau</text><text class="dg-lbl-xs" x="208" y="156" text-anchor="start" dominant-baseline="central">chaude et froide</text><text class="dg-lbl-sm" x="150" y="198" text-anchor="middle" dominant-baseline="central">200 g à 80 °C + 300 g à 20 °C → 44 °C</text></svg>
