<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 152" width="300" height="152" role="img" aria-label="Principe des actions réciproques : quand A pousse B, B pousse A ; les deux forces ont la même droite d’action et la même intensité, mais des sens contraires, et s’appliquent sur deux corps différents."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}</style><rect class="dg-t-blue" x="70" y="50" width="80" height="60" rx="6"/><text class="dg-lbl" x="96" y="96" text-anchor="middle" dominant-baseline="central">A</text><rect class="dg-t-red" x="150" y="50" width="80" height="60" rx="6"/><text class="dg-lbl" x="204" y="96" text-anchor="middle" dominant-baseline="central">B</text><path class="dg-vec" d="M150 68L198 68"/><path class="dg-vec-head" d="M204 68L194.9 72.1L194.9 63.9Z"/><text class="dg-lbl-xs" x="204" y="38" text-anchor="middle" dominant-baseline="central">F A/B (sur B)</text><path class="dg-vec" d="M150 68L102 68"/><path class="dg-vec-head" d="M96 68L105.1 63.9L105.1 72.1Z"/><text class="dg-lbl-xs" x="96" y="38" text-anchor="middle" dominant-baseline="central">F B/A (sur A)</text><text class="dg-lbl-xs" x="150" y="140" text-anchor="middle" dominant-baseline="central">même intensité, sens contraires, sur deux corps différents</text></svg>
