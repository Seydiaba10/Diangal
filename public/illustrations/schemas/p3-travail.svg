<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 206" width="300" height="206" role="img" aria-label="Soulever un sac de 20 kg de 1,5 m demande un travail W = P × h = 200 N × 1,5 m = 300 J."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><rect class="dg-t-sand" x="0" y="168" width="300" height="10"/><rect class="dg-t-grey" x="60" y="136" width="40" height="32" rx="4"/><rect class="dg-t-grey" x="60" y="36" width="40" height="32" rx="4"/><path class="dg-dash" d="M60 36h40v32h-40z"/><path class="dg-ink" d="M80 130L80 80.8"/><path class="dg-pt" d="M80 76L83.3 83.3L76.7 83.3Z"/><path class="dg-ink-thin" d="M130 168L130 39.6"/><path class="dg-pt" d="M130 36L132.4 41.5L127.6 41.5Z"/><path class="dg-ink-thin" d="M130 36L130 164.4"/><path class="dg-pt" d="M130 168L127.6 162.5L132.4 162.5Z"/><text class="dg-lbl-sm" x="138" y="100" text-anchor="start" dominant-baseline="central">h = 1,5 m</text><text class="dg-lbl-sm" x="150" y="196" text-anchor="middle" dominant-baseline="central">W = P × h = 20 × 10 × 1,5 = 300 J</text><text class="dg-lbl-xs" x="80" y="26" text-anchor="middle" dominant-baseline="central">sac de 20 kg</text></svg>
