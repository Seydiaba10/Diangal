<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 304 226" width="304" height="226" role="img" aria-label="Potentiel d’action d’un neurone (valeurs typiques) : au repos −70 mV ; une stimulation suffisante provoque une dépolarisation jusqu’à +30 mV, puis une repolarisation et une courte hyperpolarisation, en 2 ms environ."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-dash-thin{fill: none; stroke: #98a2b3; stroke-width: 1; stroke-dasharray: 3 3;}.dg-curve,.dg-curve-alt,.dg-curve-3{fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}</style><path class="dg-axis-line" d="M16 204L289.8 204"/><path class="dg-pt" d="M294 204L287.6 206.9L287.6 201.1Z"/><path class="dg-axis-line" d="M22 210L22 14.2"/><path class="dg-pt" d="M22 10L24.9 16.4L19.1 16.4Z"/><path class="dg-axis-line" d="M74 201L74 207"/><text class="dg-tick" x="74" y="215" text-anchor="middle" dominant-baseline="central">1</text><path class="dg-axis-line" d="M126 201L126 207"/><text class="dg-tick" x="126" y="215" text-anchor="middle" dominant-baseline="central">2</text><path class="dg-axis-line" d="M178 201L178 207"/><text class="dg-tick" x="178" y="215" text-anchor="middle" dominant-baseline="central">3</text><path class="dg-axis-line" d="M230 201L230 207"/><text class="dg-tick" x="230" y="215" text-anchor="middle" dominant-baseline="central">4</text><path class="dg-axis-line" d="M19 176L25 176"/><text class="dg-tick" x="16" y="176" text-anchor="end" dominant-baseline="central">−70</text><path class="dg-axis-line" d="