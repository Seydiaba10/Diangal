<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 228" width="300" height="228" role="img" aria-label="Régulation de la glycémie : quand elle augmente, le pancréas sécrète de l’insuline et le glucose est stocké ; quand elle baisse, il sécrète du glucagon et le foie libère du glucose ; la glycémie revient vers 1 g/L."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-head-cell,.dg-cell,.dg-cell-hi{fill: #f5f7f9; stroke: #101828; stroke-width: 1;}.dg-cell{fill: #ffffff;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}</style><rect class="dg-t-green" x="75" y="10" width="150" height="28" rx="8"/><text class="dg-lbl-xs" x="150" y="24" text-anchor="middle" dominant-baseline="central">glycémie normale ≈ 1 g/L</text><rect class="dg-t-red" x="10" y="66" width="120" height="28" rx="8"/><text class="dg-lbl-xs" x="70" y="80" text-anchor="middle" dominant-baseline="central">hyperglycémie (repas)</text><rect class="dg-t-blue" x="170" y="66" width="120" height="28" rx="8"/><text class="dg-lbl-xs" x="230" y="80" text-anchor="middle" dominant-baseline="central">hypoglycémie (effort)</text><rect class="dg-t-yellow" x="10" y="122" width="120" height="28" rx="8"/><text class="dg-lbl-xs" x="70" y="136" text-anchor="middle" dominant-baseline="central">pancréas : insuline</text><rect class="dg-t-yellow" x="170" y="122" width="120" height="28" rx="8"/><text class="dg-lbl-xs" x="230" y="136" text-anchor="middle" dominant-baseline="central">pancréas : glucagon</text><rect class="dg-cell" x="5" y="178" width="130" height="28" rx="8"/><text class="dg-lbl-xs" x="70" y="192" text-anchor="middle" dominant-baseline="central">foie, muscles : stockage</text><rect class="dg-cell" x="165" y="178" width="130" height="28" rx="8"/><text class="dg-lbl-xs" x="230" y="192" text-anchor="middle" dominant-baseline="central">foie : libère du glucose</text><path class="dg-ink" d="M70 94L70 116.4"/><path class="dg-pt" d="M70 120L67.6 114.5L72.4 114.5Z"/><path class="dg-ink" d="M230 94L230 116.4"/><path class="dg-pt" d="M230 120L227.6 114.5L232.4 114.5Z"/><path class="dg-ink" d="M70 150L70 172.4"/><path class="dg-pt" d="M70 176L67.6 170.5L72.4 170.5Z"/><path class="dg-ink" d="M230 150L230 172.4"/><path class="dg-pt" d="M230 176L227.6 170.5L232.4 170.5Z"/><path class="dg-dash" d="M6 192C0 120 30 30 74 26"/><path class="dg-ink-thin" d="M60 28L70.4 26.5"/><path class="dg-pt" d="M74 26L68.9 29.2L68.2 24.4Z"/><path class="dg-dash" d="M294 192C300 120 270 30 226 26"/><path class="dg-ink-thin" d="M240 28L229.6 26.5"/><path class="dg-pt" d="M226 26L231.8 24.4L231.1 29.2Z"/><text class="dg-lbl-xs" x="150" y="220" text-anchor="middle" dominant-baseline="central">le glucose sanguin revient vers 1 g/L</text></svg>
