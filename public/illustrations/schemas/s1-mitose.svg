<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 152" width="300" height="152" role="img" aria-label="Les quatre phases de la mitose : en prophase les chromosomes doubles se condensent ; en métaphase ils s’alignent au milieu ; en anaphase leurs deux moitiés se séparent ; en télophase il se forme deux cellules filles identiques."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-dash-thin{fill: none; stroke: #98a2b3; stroke-width: 1; stroke-dasharray: 3 3;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-pink{fill: #fff4ed; stroke: #f97316;}.dg-chromo,.dg-chromo-x,.dg-chromo-y{fill: #e4e1f2; stroke: #667085; stroke-width: 1;}.dg-chromo-x{fill: #fff4ed; stroke: #f97316;}.dg-chromo-y{fill: #eff8ff; stroke: #175cd3;}</style><circle class="dg-t-pink" cx="36" cy="70" r="32"/><g transform="rotate(20 26 64)"><rect class="dg-chromo-x" x="24" y="55" width="4" height="18" rx="2"/><rect class="dg-chromo-x" x="28" y="55" width="4" height="18" rx="2"/></g><g transform="rotate(-30 46 76)"><rect class="dg-chromo-y" x="44" y="67" width="4" height="18" rx="2"/><rect class="dg-chromo-y" x="48" y="67" width="4" height="18" rx="2"/></g><text class="dg-lbl-xs" x="36" y="118" text-anchor="middle" dominant-baseline="central">prophase</text><circle class="dg-t-pink" cx="110" cy="70" r="32"/><path class="dg-dash-thin" d="M110 42L110 98"/><g transform="rotate(0 108 60)"><rect class="dg-chromo-x" x="106" y="51" width="4" height="18" rx="2"/><rect class="dg-chromo-x" x="110" y="51" width="4" height="18" rx="2"/></g><g transform="rotate(0 108 82)"><rect class="dg-chromo-y" x="106" y="73" width="4" height="18" rx="2"/><rect class="dg-chromo-y" x="110" y="73" width="4" height="18" rx="2"/></g><text class="dg-lbl-xs" x="110" y="118" text-anchor="middle" dominant-baseline="central">métaphase</text><circle class="dg-t-pink" cx="184" cy="70" r="32"/><rect class="dg-chromo-x" x="162" y="58" width="4" height="16" rx="2"/><rect class="dg-chromo-x" x="200" y="58" width="4" height="16" rx="2"/><rect class="dg-chromo-y" x="162" y="80" width="4" height="16" rx="2"/><rect class="dg-chromo-y" x="200" y="80" width="4" height="16" rx="2"/><path class="dg-ink-thin" d="M176 54L165 54"/><path class="dg-pt" d="M162 54L166.6 52L166.6 56Z"/><path class="dg-ink-thin" d="M190 54L201 54"/><path class="dg-pt" d="M204 54L199.4 56L199.4 52Z"/><text class="dg-lbl-xs" x="184" y="118" text-anchor="middle" dominant-baseline="central">anaphase</text><ellipse class="dg-t-pink" cx="256" cy="70" rx="18" ry="28"/><ellipse class="dg-t-pink" cx="286" cy="70" rx="18" ry="28"/><rect class="dg-chromo-x" x="252" y="60" width="4" height="14" rx="2"/><rect class="dg-chromo-y" x="256" y="76" width="4" height="14" rx="2"/><rect class="dg-chromo-x" x="282" y="60" width="4" height="14" rx="2"/><rect class="dg-chromo-y" x="286" y="76" width="4" height="14" rx="2"/><text class="dg-lbl-xs" x="271" y="118" text-anchor="middle" dominant-baseline="central">télophase</text><text class="dg-lbl-sm" x="150" y="18" text-anchor="middle" dominant-baseline="central">mitose d’une cellule à deux chromosomes</text><text class="dg-lbl-xs" x="150" y="142" text-anchor="middle" dominant-baseline="central">deux cellules filles identiques à la cellule mère</text></svg>
