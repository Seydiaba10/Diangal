<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Une frise : l’empire du Ghana, puis l’empire du Mali, puis l’empire songhaï."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-node{fill: #101828;}.dg-arrow{fill: none; stroke: #e31b23; stroke-width: 2;}.dg-axis{fill: currentColor; font-size: 12px; font-weight: 600;}.dg-text{fill: currentColor; font-size: 17px; font-weight: 600;}</style><path class="dg-arrow" d="M30 10V190m-6-8 6 8 6-8"/><circle class="dg-node" cx="30" cy="34" r="6"/><text class="dg-text" x="48" y="26" text-anchor="start" dominant-baseline="central">Ghana (Wagadou)</text><text class="dg-axis" x="48" y="46" text-anchor="start" dominant-baseline="central">affaibli au XIe siècle</text><circle class="dg-node" cx="30" cy="94" r="6"/><text class="dg-text" x="48" y="86" text-anchor="start" dominant-baseline="central">Mali</text><text class="dg-axis" x="48" y="106" text-anchor="start" dominant-baseline="central">fondé vers 1235 (Kirina)</text><circle class="dg-node" cx="30" cy="154" r="6"/><text class="dg-text" x="48" y="146" text-anchor="start" dominant-baseline="central">Songhaï</text><text class="dg-axis" x="48" y="166" text-anchor="start" dominant-baseline="central">détruit en 1591 (Tondibi)</text></svg>
