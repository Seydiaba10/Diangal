<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 210" width="300" height="210" role="img" aria-label="Arbre pondéré (exemple) : P(A) = 0,4, P_A(B) = 0,7 et P_Ā(B) = 0,2 ; on multiplie le long d’un chemin et on additionne les chemins qui mènent à B : P(B) = 0,28 + 0,12 = 0,4."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}</style><path class="dg-ink-thin" d="M20 100L100 50"/><text class="dg-lbl-xs" x="65" y="67" text-anchor="middle" dominant-baseline="central">0,4</text><path class="dg-ink-thin" d="M20 100L100 150"/><text class="dg-lbl-xs" x="65" y="117" text-anchor="middle" dominant-baseline="central">0,6</text><text class="dg-lbl-math" x="110" y="50" text-anchor="middle" dominant-baseline="central">A</text><text class="dg-lbl-math" x="110" y="150" text-anchor="middle" dominant-baseline="central">Ā</text><path class="dg-ink-thin" d="M120 50L190 24"/><text class="dg-lbl-xs" x="160" y="29" text-anchor="middle" dominant-baseline="central">0,7</text><path class="dg-ink-thin" d="M120 50L190 76"/><text class="dg-lbl-xs" x="160" y="55" text-anchor="middle" dominant-baseline="central">0,3</text><path class="dg-ink-thin" d="M120 150L190 124"/><text class="dg-lbl-xs" x="160" y="129" text-anchor="middle" dominant-baseline="central">0,2</text><path class="dg-ink-thin" d="M120 150L190 176"/><text class="dg-lbl-xs" x="160" y="155" text-anchor="middle" dominant-baseline="central">0,8</text><text class="dg-lbl-math" x="200" y="24" text-anchor="middle" dominant-baseline="central">B</text><text class="dg-lbl-math" x="200" y="76" text-anchor="middle" dominant-baseline="central">B̄</text><text class="dg-lbl-math" x="200" y="124" text-anchor="middle" dominant-baseline="central">B</text><text class="dg-lbl-math" x="200" y="176" text-anchor="middle" dominant-baseline="central">B̄</text><text class="dg-lbl-xs" x="214" y="24" text-anchor="start" dominant-baseline="central">0,4 × 0,7 = 0,28</text><text class="dg-lbl-xs" x="214" y="124" text-anchor="start" dominant-baseline="central">0,6 × 0,2 = 0,12</text><text class="dg-lbl-sm" x="150" y="200" text-anchor="middle" dominant-baseline="central">P(B) = 0,28 + 0,12 = 0,40</text></svg>
