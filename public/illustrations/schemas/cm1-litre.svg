<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 310 176" width="310" height="176" role="img" aria-label="Un cube de 10 cm de côté : son volume est 1 dm³, il contient 1 litre ; 1 litre d’eau pèse 1 kg."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-figure,.dg-segment{fill: none; stroke: #006b32; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round;}.dg-object{fill: #fffbd6; stroke: #6b5c00; stroke-width: 2;}.dg-axis{fill: currentColor; font-size: 12px; font-weight: 600;}.dg-solid,.dg-solid-top,.dg-solid-side{stroke: #101828; stroke-width: 1.5; stroke-linejoin: round;}.dg-solid-top{fill: #fffbd6;}.dg-solid-side{fill: #6b5c00;}.dg-text{fill: currentColor; font-size: 17px; font-weight: 600;}</style><path class="dg-solid-top" d="M60 50L100 24H200L160 50Z"/><path class="dg-solid-side" d="M160 50L200 24V124L160 150Z" fill="none"/><rect class="dg-object" x="60" y="50" width="100" height="100"/><path class="dg-figure" d="M60 50L100 24H200V124L160 150M160 50L200 24"/><text class="dg-axis" x="110" y="166" text-anchor="middle" dominant-baseline="central">10 cm = 1 dm</text><text class="dg-text" x="250" y="70" text-anchor="middle" dominant-baseline="central">1 dm³</text><text class="dg-text" x="250" y="96" text-anchor="middle" dominant-baseline="central">= 1 L</text><text class="dg-axis" x="250" y="122" text-anchor="middle" dominant-baseline="central">= 1 kg d’eau</text></svg>
