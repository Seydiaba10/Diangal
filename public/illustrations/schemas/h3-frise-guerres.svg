<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 110" width="300" height="110" role="img" aria-label="Frise de 1910 à 1950 : la Première Guerre mondiale (1914-1918), la crise des années 1930 après le krach de 1929, la Seconde Guerre mondiale (1939-1945) ; massacre de Thiaroye le 1er décembre 1944."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-period,.dg-period-alt{fill: #fffaeb; stroke: #b54708; stroke-width: 1;}.dg-period-alt{fill: #eff8ff; stroke: #175cd3;}</style><rect class="dg-period" x="42.8" y="51" width="26.8" height="10"/><path class="dg-leader" d="M56.2 51L71.2 42"/><text class="dg-lbl-xs" x="71.2" y="36" text-anchor="middle" dominant-baseline="central">Première Guerre mondiale</text><rect class="dg-period-alt" x="143.3" y="51" width="67" height="10"/><path class="dg-leader" d="M176.8 51L176.8 26"/><text class="dg-lbl-xs" x="176.8" y="20" text-anchor="middle" dominant-baseline="central">crise des années 1930</text><rect class="dg-period" x="210.3" y="51" width="40.2" height="10"/><path class="dg-leader" d="M230.4 51L230.4 42"/><text class="dg-lbl-xs" x="230.4" y="36" text-anchor="middle" dominant-baseline="central">Seconde Guerre mondiale</text><path class="dg-axis-line" d="M10 56L291.8 56"/><path class="dg-pt" d="M296 56L289.6 58.9L289.6 53.1Z"/><path class="dg-axis-line" d="M16 52L16 60"/><text class="dg-tick" x="16" y="69" text-anchor="middle" dominant-baseline="central">1910</text><path class="dg-axis-line" d="M83 52L83 60"/><text class="dg-tick" x="83" y="69" text-anchor="middle" dominant-baseline="central">1920</text><path class="dg-axi