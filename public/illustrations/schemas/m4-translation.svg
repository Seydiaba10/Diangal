<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 194" width="300" height="194" role="img" aria-label="Translation qui transforme A en B : chaque point du triangle glisse de la même façon (même direction, même sens, même longueur) ; ABM′M est un parallélogramme."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-pt{fill: #101828;}.dg-dash-thin{fill: none; stroke: #98a2b3; stroke-width: 1; stroke-dasharray: 3 3;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-geo-fill{fill: #1d4ed8; opacity: 0.08; stroke: #101828; stroke-width: 1.8;}</style><path class="dg-vec" d="M30 160L125 122"/><path class="dg-vec-head" d="M130 120L123.7 126.5L121 119.6Z"/><text class="dg-lbl-math" x="80" y="128" text-anchor="middle" dominant-baseline="central">u</text><circle class="dg-pt" cx="30" cy="160" r="2.8"/><text class="dg-lbl-math" x="18" y="160" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="130" cy="120" r="2.8"/><text class="dg-lbl-math" x="142" y="120" text-anchor="middle" dominant-baseline="central">B</text><path class="dg-geo-fill" d="M40 60L80 30L96 78Z"/><path class="dg-geo-fill" d="M140 20L180 -10L196 38Z"/><path class="dg-dash-thin" d="M40 60L140 20"/><path class="dg-dash-thin" d="M80 30L180 -10"/><path class="dg-dash-thin" d="M96 78L196 38"/><text class="dg-lbl-math" x="30" y="60" text-anchor="middle" dominant-baseline="central">M</text><text class="dg-lbl-math" x="152" y="16" text-anchor="middle" dominant-baseline="central">M′</text><text class="dg-lbl-xs" x="150" y="186" text-anchor="middle" dominant-baseline="central">même direction, même sens, même longueur que AB</text></svg>
