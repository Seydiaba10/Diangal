<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 216" width="300" height="216" role="img" aria-label="Le cycle des roches : le magma refroidi donne des roches magmatiques ; l’érosion les détruit et leurs débris forment des roches sédimentaires ; enfouies, elles deviennent métamorphiques ; si elles fondent, elles redonnent un magma."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-t-violet{fill: #e4e1f2; stroke: #667085;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><rect class="dg-t-red" x="88" y="8" width="124" height="32" rx="10"/><text class="dg-lbl-xs" x="150" y="24" text-anchor="middle" dominant-baseline="central">magma</text><rect class="dg-t-grey" x="172" y="94" width="124" height="32" rx="10"/><text class="dg-lbl-xs" x="234" y="110" text-anchor="middle" dominant-baseline="central">roches magmatiques</text><rect class="dg-t-sand" x="88" y="180" width="124" height="32" rx="10"/><text class="dg-lbl-xs" x="150" y="196" text-anchor="middle" dominant-baseline="central">roches sédimentaires</text><rect class="dg-t-violet" x="4" y="94" width="124" height="32" rx="10"/><text class="dg-lbl-xs" x="66" y="110" text-anchor="middle" dominant-baseline="central">roches métamorphiques</text><path class="dg-ink" d="M196 40L223.5 85.9"/><path class="dg-pt" d="M226 90L219.4 85.4L225 82.1Z"/><text class="dg-lbl-xs" x="222" y="58" text-anchor="start" dominant-baseline="central">refroidissement</text><path class="dg-ink" d="M226 128L198.5 173.9"/><path class="dg-pt" d="M196 178L197 170.1L202.6 173.4Z"/><text class="dg-lbl-xs" x="222" y="162" text-anchor="start" dominant-baseline="central">érosion, dépôt</text><path class="dg-ink" d="M104 178L76.5 132.1"/><path class="dg-pt" d="M74 128L80.6 132.6L75 135.9Z"/><text class="dg-lbl-xs" x="80" y="162" text-anchor="end" dominant-baseline="central">enfouissement</text><path class="dg-ink" d="M74 92L101.6 44.2"/><path class="dg-pt" d="M104 40L103.2 48L97.5 44.7Z"/><text class="dg-lbl-xs" x="80" y="58" text-anchor="end" dominant-baseline="central">fusion</text></svg>
