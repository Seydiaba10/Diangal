<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 196" width="300" height="196" role="img" aria-label="Une bactérie, cellule sans noyau avec une paroi, un chromosome circulaire et souvent un flagelle ; un virus, beaucoup plus petit, fait d’une capside de protéines qui enferme son matériel génétique (tailles non respectées)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-cell-wall{fill: #e3eed9; stroke: #15803d; stroke-width: 2;}.dg-dna,.dg-rna{fill: none; stroke: #6d28d9; stroke-width: 2.5;}.dg-capsid{fill: #e4e1f2; stroke: #6d28d9; stroke-width: 1.6;}</style><rect class="dg-cell-wall" x="20" y="50" width="150" height="70" rx="35"/><rect class="dg-t-yellow" x="26" y="56" width="138" height="58" rx="29"/><path class="dg-dna" d="M60 84c10-14 30 14 40 0s30-14 40 0"/><path class="dg-ink-thin" d="M170 85c20-6 30 10 50 0"/><path class="dg-leader" d="M30 60L28 26"/><circle class="dg-pt" cx="30" cy="60" r="1.8"/><text class="dg-lbl-xs" x="30" y="26" text-anchor="start" dominant-baseline="central">paroi</text><path class="dg-leader" d="M80 84L88.5 150"/><circle class="dg-pt" cx="80" cy="84" r="1.8"/><text class="dg-lbl-xs" x="86.5" y="144" text-anchor="end" dominant-baseline="central">ADN (chromosome</text><text class="dg-lbl-xs" x="86.5" y="156" text-anchor="end" dominant-baseline="central">circulaire)</text><path class="dg-leader" d="M196 86L194 140"/><circle class="dg-pt" cx="196" cy="86" r="1.8"/><text class="dg-lbl-xs" x="196" y="140" text-anchor="start" dominant-baseline="central">flagelle</text><text class="dg-lbl-sm" x="95" y="186" text-anchor="middle" dominant-baseline="central">bactérie (≈ 2 µm)</text><path class="dg-capsid" d="M276 80L263 57.5L237 57.5L224 80L237 102.5L263 102.5Z"/><path class="dg-dna" d="M240 80c5-8 10 8 15 0s10-8 15 0"/><path class="dg-leader" d="M272 66L255.5 26"/><circle class="dg-pt" cx="272" cy="66" r="1.8"/><text class="dg-lbl-xs" x="257.5" y="26" text-anchor="start" dominant-baseline="central">capside</text><path class="dg-leader" d="M250 80L244.5 140"/><circle class="dg-pt" cx="250" cy="80" r="1.8"/><text class="dg-lbl-xs" x="246.5" y="134" text-anchor="start" dominant-baseline="central">matériel</text><text class="dg-lbl-xs" x="246.5" y="146" text-anchor="start" dominant-baseline="central">génétique</text><text class="dg-lbl-sm" x="250" y="186" text-anchor="middle" dominant-baseline="central">virus (≈ 0,1 µm)</text></svg>
