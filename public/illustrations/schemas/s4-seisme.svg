<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 196" width="300" height="196" role="img" aria-label="Un séisme (schéma en coupe) : la rupture des roches le long d’une faille, au foyer, libère des ondes sismiques ; l’épicentre est le point de la surface situé juste au-dessus du foyer."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-fault{fill: none; stroke: #101828; stroke-width: 2.5; stroke-dasharray: 8 4;}.dg-wave{fill: none; stroke: #f04438; stroke-width: 1.2; opacity: 0.7;}</style><rect class="dg-t-sand" x="0" y="40" width="300" height="150"/><path class="dg-ink" d="M0 40H300"/><path class="dg-fault" d="M178 40L120 190"/><circle class="dg-wave" cx="146" cy="122" r="20"/><circle class="dg-wave" cx="146" cy="122" r="40"/><circle class="dg-wave" cx="146" cy="122" r="62"/><circle class="dg-wave" cx="146" cy="122" r="86"/><circle class="dg-vec-head" cx="146" cy="122" r="5"/><path class="dg-dash" d="M146 122L146 40"/><path class="dg-vec-head" d="M139 40l7 -12 7 12z"/><path class="dg-leader" d="M146 122L72 168"/><circle class="dg-pt" cx="146" cy="122" r="1.8"/><text class="dg-lbl-xs" x="70" y="162" text-anchor="end" dominant-baseline="central">foyer</text><text class="dg-lbl-xs" x="70" y="174" text-anchor="end" dominant-baseline="central">(hypocentre)</text><path class="dg-leader" d="M146 34L72 18"/><circle class="dg-pt" cx="146" cy="34" r="1.8"/><text class="dg-lbl-xs" x="70" y="18" text-anchor="end" dominant-baseline="central">épicentre</text><path class="dg-leader" d="M166 70L238 18"/><circle class="dg-pt" cx="166" cy="70" r="1.8"/><text class="dg-lbl-xs" x="240" y="18" text-anchor="start" dominant-baseline="central">faille</text><path class="dg-leader" d="M208 122L238 168"/><circle class="dg-pt" cx="208" cy="122" r="1.8"/><text class="dg-lbl-xs" x="240" y="162" text-anchor="start" dominant-baseline="central">ondes</text><text class="dg-lbl-xs" x="240" y="174" text-anchor="start" dominant-baseline="central">sismiques</text></svg>
