<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 152" width="300" height="152" role="img" aria-label="Coupe de la vallée du fleuve Sénégal : de part et d’autre du fleuve, le walo, inondé à la crue, puis le diéri, terres hautes et sèches."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-water{fill: #2e90fa; opacity: 0.55;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}</style><path class="dg-t-sand" d="M0 46L60 48L96 84L130 98L150 104L170 98L204 84L240 48L300 46L300 150L0 150Z"/><path class="dg-water" d="M120 96L150 104L180 96L174 116L126 116Z"/><path class="dg-t-green" d="M96 84L130 98L150 104L170 98L204 84L204 92L170 108L130 108L96 92Z"/><text class="dg-lbl-xs" x="150" y="128" text-anchor="middle" dominant-baseline="central">fleuve</text><path class="dg-leader" d="M104 90L66 120"/><text class="dg-lbl-xs" x="12" y="124" text-anchor="start" dominant-baseline="central">walo (inondé)</text><path class="dg-leader" d="M196 90L234 120"/><text class="dg-lbl-xs" x="288" y="124" text-anchor="end" dominant-baseline="central">walo</text><path class="dg-leader" d="M30 46L40 24"/><text class="dg-lbl-xs" x="44" y="20" text-anchor="start" dominant-baseline="central">diéri (terres sèches)</text><path class="dg-leader" d="M270 46L262 24"/><text class="dg-lbl-xs" x="288" y="20" text-anchor="end" dominant-baseline="central">diéri</text><text class="dg-lbl-xs" x="150" y="144" text-anchor="middle" dominant-baseline="central">cultures de décrue sur le walo ; mil sous pluie sur le diéri</text></svg>
