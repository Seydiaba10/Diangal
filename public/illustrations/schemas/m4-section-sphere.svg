<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Section d’une sphère de rayon 5 cm par un plan situé à 3 cm du centre : c’est un cercle de rayon 4 cm, car r² = 5² − 3² = 16."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-geo-line{stroke: #1d4ed8; stroke-width: 1.4;}.dg-solid-face,.dg-solid-face-top,.dg-solid-face-side{fill: #eff8ff; stroke: #101828; stroke-width: 1.6; stroke-linejoin: round;}.dg-section{fill: #fffaeb; stroke: #b54708; stroke-width: 1.5;}</style><circle class="dg-solid-face" cx="110" cy="110" r="80"/><ellipse class="dg-section" cx="110" cy="62" rx="64" ry="16"/><path class="dg-dash" d="M110 110L110 62"/><path class="dg-vec" d="M110 62L174 62"/><path class="dg-geo-line" d="M110 110L174 62"/><path class="dg-ink" d="M110 68L116 68L116 62"/><circle class="dg-pt" cx="110" cy="110" r="2.8"/><text class="dg-lbl-math" x="110" y="123" text-anchor="middle" dominant-baseline="central">O</text><text class="dg-lbl-sm" x="102" y="86" text-anchor="end" dominant-baseline="central">3</text><text class="dg-lbl-sm" x="142" y="52" text-anchor="middle" dominant-baseline="central">r = 4</text><text class="dg-lbl-sm" x="156" y="90" text-anchor="start" dominant-baseline="central">R = 5</text><text class="dg-lbl-sm" x="250" y="150" text-anchor="middle" dominant-baseline="central">r² = 5² − 3²</text><text class="dg-lbl-sm" x="250" y="168" text-anchor="middle" dominant-baseline="central">r = 4 cm</text></svg>
