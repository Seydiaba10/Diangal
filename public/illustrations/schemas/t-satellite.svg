<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 234" width="300" height="234" role="img" aria-label="Satellite en orbite circulaire : la force de gravitation exercée par la Terre est dirigée vers son centre ; la vitesse est tangente à l’orbite (tailles non respectées)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-pt{fill: #101828;}.dg-curve,.dg-curve-alt,.dg-curve-3{fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><circle class="dg-t-blue" cx="140" cy="110" r="40"/><text class="dg-lbl-xs" x="140" y="110" text-anchor="middle" dominant-baseline="central">Terre</text><circle class="dg-dash" cx="140" cy="110" r="90"/><rect class="dg-t-grey" x="202.8" y="46" width="12" height="12" rx="2"/><path class="dg-vec" d="M208.8 52L179.3 76.9"/><path class="dg-vec-head" d="M175.2 80.4L179.1 72.3L183.8 77.9Z"/><text class="dg-lbl-math" x="173.9" y="75.3" text-anchor="end" dominant-baseline="central">F</text><path class="dg-curve" d="M208.8 52L240.1 89.2"/><path class="dg-pt" d="M243.6 93.3L235.5 89.4L241.1 84.7Z"/><text class="dg-lbl-math" x="251.6" y="93.3" text-anchor="start" dominant-baseline="central">v</text><text class="dg-lbl-xs" x="150" y="214" text-anchor="middle" dominant-baseline="central">force dirigée vers le centre de la Terre ;</text><text class="dg-lbl-xs" x="150" y="226" text-anchor="middle" dominant-baseline="central">vitesse tangente à l’orbite circulaire</text></svg>
