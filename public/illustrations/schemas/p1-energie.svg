<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 284 209" width="284" height="209" role="img" aria-label="Objet de 1 kg lâché de 5 m sans frottement : l’énergie potentielle Ep = m g z diminue quand il descend, l’énergie cinétique Ec augmente, et leur somme Em reste égale à 50 J."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-curve,.dg-curve-alt,.dg-curve-3{fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}.dg-curve-alt{stroke: #e31b23;}.dg-curve-3{stroke: #12b76a;}</style><path class="dg-axis-line" d="M16 187L269.8 187"/><path class="dg-pt" d="M274 187L267.6 189.9L267.6 184.1Z"/><path class="dg-axis-line" d="M22 193L22 14.2"/><path class="dg-pt" d="M22 10L24.9 16.4L19.1 16.4Z"/><path class="dg-axis-line" d="M70 184L70 190"/><text class="dg-tick" x="70" y="198" text-anchor="middle" dominant-baseline="central">1</text><path class="dg-axis-line" d="M118 184L118 190"/><text class="dg-tick" x="118" y="198" text-anchor="middle" dominant-baseline="central">2</text><path class="dg-axis-line" d="M166 184L166 190"/><text class="dg-tick" x="166" y="198" text-anchor="middle" dominant-baseline="central">3</text><path class="dg-axis-line" d="M214 184L214 190"/><text class="dg-tick" x="214" y="198" text-anchor="middle" dominant-baseline="central">4</text><path class="dg-axis-line" d="M262 184L262 190"/><text class="dg-tick" x="262" y="198" text-anchor="middle" dominant-baseline="central">5</text><path class="dg-axis-line" d="M19 157L25 157"/><text class="dg-tick" x="16" y="157" text-anchor="end" dominant-baseline="central">10</text><path class="dg-axis-line" d="M19 127L25 127"/><text class="dg-tick" x="16" y="127" text-anchor="end" dominant-baseline="central">20</text><path class="dg-axis-line" d="M19 97L25 97"/><text class="dg-tick" x="16" y="97" text-anchor="end" dominant-baseline="central">30</text><path class="dg-axis-line" d="M19 67L25 67"/><text class="dg-tick" x="16" y="67" text-anchor="end" dominant-baseline="central">40</text><path class="dg-axis-line" d="M19 37L25 37"/><text class="dg-tick" x="16" y="37" text-anchor="end" dominant-baseline="central">50</text><text class="dg-tick" x="14" y="197" text-anchor="middle" dominant-baseline="central">O</text><text class="dg-lbl-math" x="272" y="176" text-anchor="end" dominant-baseline="central">hauteur z (m)</text><text class="dg-lbl-math" x="30" y="14" text-anchor="start" dominant-baseline="central">énergie (J)</text><path class="dg-curve-3" d="M22 37L262 37"/><path class="dg-curve" d="M22 187L262 37"/><path class="dg-curve-alt" d="M22 37L262 187"/><text class="dg-lbl-xs" x="142" y="28" text-anchor="middle" dominant-baseline="central">Em = Ec + Ep</text><text class="dg-lbl-sm" x="233.2" y="73" text-anchor="middle" dominant-baseline="central">Ep</text><text class="dg-lbl-sm" x="50.8" y="73" text-anchor="middle" dominant-baseline="central">Ec</text></svg>
