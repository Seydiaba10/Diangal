<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 186" width="300" height="186" role="img" aria-label="Les étapes de la potabilisation : on laisse décanter l’eau brute, on la filtre, puis on la désinfecte au chlore pour obtenir une eau potable."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-head-cell,.dg-cell,.dg-cell-hi{fill: #f5f7f9; stroke: #101828; stroke-width: 1;}.dg-cell{fill: #ffffff;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}</style><rect class="dg-t-sand" x="70" y="14" width="160" height="24" rx="8"/><text class="dg-lbl-xs" x="150" y="26" text-anchor="middle" dominant-baseline="central">eau brute</text><path class="dg-ink" d="M150 38L150 44.4"/><path class="dg-pt" d="M150 48L147.6 42.5L152.4 42.5Z"/><rect class="dg-cell" x="70" y="48" width="160" height="24" rx="8"/><text class="dg-lbl-xs" x="150" y="60" text-anchor="middle" dominant-baseline="central">décantation</text><path class="dg-ink" d="M150 72L150 78.4"/><path class="dg-pt" d="M150 82L147.6 76.5L152.4 76.5Z"/><rect class="dg-cell" x="70" y="82" width="160" height="24" rx="8"/><text class="dg-lbl-xs" x="150" y="94" text-anchor="middle" dominant-baseline="central">filtration</text><path class="dg-ink" d="M150 106L150 112.4"/><path class="dg-pt" d="M150 116L147.6 110.5L152.4 110.5Z"/><rect class="dg-cell" x="70" y="116" width="160" height="24" rx="8"/><text class="dg-lbl-xs" x="150" y="128" text-anchor="middle" dominant-baseline="central">désinfection (chlore)</text><path class="dg-ink" d="M150 140L150 146.4"/><path class="dg-pt" d="M150 150L147.6 144.5L152.4 144.5Z"/><rect class="dg-t-blue" x="70" y="150" width="160" height="24" rx="8"/><text class="dg-lbl-xs" x="150" y="162" text-anchor="middle" dominant-baseline="central">eau potable</text></svg>
