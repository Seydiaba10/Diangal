<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 206" width="300" height="206" role="img" aria-label="Triangle ABC rectangle en A : pour l’angle B̂, [AB] est le côté adjacent, [AC] le côté opposé, [BC] l’hypoténuse ; cos B̂ = AB/BC, sin B̂ = AC/BC, tan B̂ = AC/AB."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-geo-fill{fill: #1d4ed8; opacity: 0.08; stroke: #101828; stroke-width: 1.8;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}</style><path class="dg-geo-fill" d="M230 160L30 160L230 40Z"/><path class="dg-ink" d="M220 160L220 150L230 150"/><path class="dg-arc" d="M64 160A34 34 0 0 0 59.2 142.5"/><circle class="dg-pt" cx="230" cy="160" r="2.8"/><text class="dg-lbl-math" x="240" y="171" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="30" cy="160" r="2.8"/><text class="dg-lbl-math" x="20" y="171" text-anchor="middle" dominant-baseline="central">B</text><circle class="dg-pt" cx="230" cy="40" r="2.8"/><text class="dg-lbl-math" x="240" y="30" text-anchor="middle" dominant-baseline="central">C</text><text class="dg-lbl-math" x="76" y="150" text-anchor="middle" dominant-baseline="central">B̂</text><text class="dg-lbl-xs" x="130" y="176" text-anchor="middle" dominant-baseline="central">côté adjacent à B̂ [AB]</text><text class="dg-lbl-xs" x="246" y="100" text-anchor="start" dominant-baseline="central">côté opposé</text><text class="dg-lbl-xs" x="246" y="112" text-anchor="start" dominant-baseline="central">à B̂ [AC]</text><text class="dg-lbl-xs" x="112" y="86" text-anchor="end" dominant-baseline="central">hypoténuse [BC]</text><text class="dg-lbl-xs" x="150" y="196" text-anchor="middle" dominant-baseline="central">cos B̂ = AB/BC ; sin B̂ = AC/BC ; tan B̂ = AC/AB</text></svg>
