<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 222" width="300" height="222" role="img" aria-label="La structure du globe (quart de sphère en coupe, épaisseurs à l’échelle) : une croûte très mince, le manteau jusqu’à 2 900 km de profondeur, puis le noyau, liquide dans sa partie externe et solide au centre."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-t-pink{fill: #fff4ed; stroke: #f97316;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}</style><path class="dg-t-sand" d="M14 190L174 190A160 160 0 0 0 14 30Z"/><path class="dg-t-red" d="M14 190L173.2464678178964 190A159.2464678178964 159.2464678178964 0 0 0 14 30.753532182103612Z"/><path class="dg-t-yellow" d="M14 190L101.1585557299843 190A87.1585557299843 87.1585557299843 0 0 0 14 102.8414442700157Z"/><path class="dg-t-pink" d="M14 190L44.6436420722135 190A30.643642072213503 30.643642072213503 0 0 0 14 159.3563579277865Z"/><path class="dg-leader" d="M129.2 78L194 22"/><circle class="dg-pt" cx="129.2" cy="78" r="1.8"/><text class="dg-lbl-xs" x="196" y="16" text-anchor="start" dominant-baseline="central">croûte</text><text class="dg-lbl-xs" x="196" y="28" text-anchor="start" dominant-baseline="central">(5 à 70 km)</text><path class="dg-leader" d="M149.4 126.3L194 70"/><circle class="dg-pt" cx="149.4" cy="126.3" r="1.8"/><text class="dg-lbl-xs" x="196" y="70" text-anchor="start" dominant-baseline="central">manteau</text><path class="dg-leader" d="M83.7 150.8L194 118"/><circle class="dg-pt" cx="83.7" cy="150.8" r="1.8"/><text class="dg-lbl-xs" x="196" y="112" text-anchor="start" dominant-baseline="central">noyau externe</text><text class="dg-lbl-xs" x="196" y="124" text-anchor="start" dominant-baseline="central">(liquide)</text><path class="dg-leader" d="M29.3 174.7L194 166"/><circle class="dg-pt" cx="29.3" cy="174.7" r="1.8"/><text class="dg-lbl-xs" x="196" y="160" text-anchor="start" dominant-baseline="central">graine</text><text class="dg-lbl-xs" x="196" y="172" text-anchor="start" dominant-baseline="central">(solide)</text><text class="dg-tick" x="101.2" y="201" text-anchor="middle" dominant-baseline="central">2 900 km</text><text class="dg-tick" x="14" y="201" text-anchor="start" dominant-baseline="central">6 370 km</text><text class="dg-tick" x="174" y="201" text-anchor="middle" dominant-baseline="central">0</text><text class="dg-lbl-xs" x="94" y="215" text-anchor="middle" dominant-baseline="central">profondeur</text></svg>
