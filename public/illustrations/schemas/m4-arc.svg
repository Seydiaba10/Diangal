<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 216" width="300" height="216" role="img" aria-label="Arc AB intercepté par un angle au centre de 60° dans un cercle de rayon 6 cm : sa longueur est 2π × 6 × 60 ÷ 360, environ 6,28 cm."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-pt{fill: #101828;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}.dg-arc-thick{fill: none; stroke: #e31b23; stroke-width: 4;}</style><circle class="dg-geo" cx="110" cy="110" r="84"/><path class="dg-geo" d="M110 110L192.7 95.4"/><path class="dg-geo" d="M110 110L138.7 31.1"/><path class="dg-arc-thick" d="M192.7238512530255 95.41355307597786A84 84 0 0 0 138.72969203935617 31.065819853983697"/><path class="dg-arc" d="M133.6 105.8A24 24 0 0 0 118.2 87.4"/><text class="dg-lbl-sm" x="139.1" y="85.6" text-anchor="middle" dominant-baseline="central">60°</text><circle class="dg-pt" cx="110" cy="110" r="2.8"/><text class="dg-lbl-math" x="100" y="121" text-anchor="middle" dominant-baseline="central">O</text><circle class="dg-pt" cx="192.7" cy="95.4" r="2.8"/><text class="dg-lbl-math" x="204.7" y="95.4" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="138.7" cy="31.1" r="2.8"/><text class="dg-lbl-math" x="148.7" y="21.1" text-anchor="middle" dominant-baseline="central">B</text><text class="dg-lbl-xs" x="148" y="122" text-anchor="middle" dominant-baseline="central">r = 6 cm</text><text class="dg-lbl-sm" x="150" y="206" text-anchor="middle" dominant-baseline="central">ℓ = 2π × 6 × 60 ÷ 360 ≈ 6,28 cm</text></svg>
