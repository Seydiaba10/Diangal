<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 150" width="300" height="150" role="img" aria-label="Barycentre G de (A, 1) et (B, 3) : AG = 3/4 de AB ; G est plus près de B, qui a le plus grand poids."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}</style><path class="dg-geo" d="M30 70L270 70"/><circle class="dg-pt" cx="30" cy="70" r="2.8"/><text class="dg-lbl-math" x="30" y="58" text-anchor="middle" dominant-baseline="central">A (1)</text><circle class="dg-pt" cx="270" cy="70" r="2.8"/><text class="dg-lbl-math" x="270" y="58" text-anchor="middle" dominant-baseline="central">B (3)</text><circle class="dg-pt" cx="210" cy="70" r="2.8"/><text class="dg-lbl-math" x="210" y="58" text-anchor="middle" dominant-baseline="central">G</text><path class="dg-ink-thin" d="M30 66L30 74"/><path class="dg-ink-thin" d="M90 66L90 74"/><path class="dg-ink-thin" d="M150 66L150 74"/><path class="dg-ink-thin" d="M210 66L210 74"/><path class="dg-ink-thin" d="M270 66L270 74"/><path class="dg-vec" d="M30 100L204.6 100"/><path class="dg-vec-head" d="M210 100L201.8 103.7L201.8 96.3Z"/><text class="dg-lbl-sm" x="105" y="116" text-anchor="middle" dominant-baseline="central">AG = 3/4 AB</text><text class="dg-lbl-xs" x="150" y="140