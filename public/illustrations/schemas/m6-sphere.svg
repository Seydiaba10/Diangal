<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 164" width="300" height="164" role="img" aria-label="Sphère de centre O et de rayon R ; l’équateur dessiné est un grand cercle : il a le même centre et le même rayon que la sphère."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-solid-face,.dg-solid-face-top,.dg-solid-face-side{fill: #eff8ff; stroke: #101828; stroke-width: 1.6; stroke-linejoin: round;}.dg-hidden,.dg-hidden-thin{fill: none; stroke: #667085; stroke-width: 1.3; stroke-dasharray: 4 3;}</style><circle class="dg-solid-face" cx="110" cy="86" r="66"/><path class="dg-ink" d="M44 86A66 19.8 0 0 0 176 86"/><path class="dg-hidden" d="M44 86A66 19.8 0 0 1 176 86"/><path class="dg-vec" d="M110 86L176 86"/><circle class="dg-pt" cx="110" cy="86" r="2.5"/><text class="dg-lbl-math" x="110" y="98" text-anchor="middle" dominant-baseline="central">O</text><text class="dg-lbl-math" x="146" y="76" text-anchor="middle" dominant-baseline="central">R</text><path class="dg-leader" d="M70 96L196 150"/><circle class="dg-pt" cx="70" cy="96" r="1.8"/><text class="dg-lbl-sm" x="199" y="150" text-anchor="start" dominant-baseline="central">grand cercle</text><path class="dg-leader" d="M140 34L196 26"/><circle class="dg-pt" cx="140" cy="34" r="1.8"/><text class="dg-lbl-sm" x="199" y="26" text-anchor="start" dominant-baseline="central">sphère</text></svg>
