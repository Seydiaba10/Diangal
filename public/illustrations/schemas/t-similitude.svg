<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Similitude directe de centre Ω, de rapport k = 1,6 et d’angle θ = 40° : elle tourne la figure autour de Ω et l’agrandit ; elle conserve les angles et multiplie les longueurs par k."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-dash-thin{fill: none; stroke: #98a2b3; stroke-width: 1; stroke-dasharray: 3 3;}.dg-geo-fill{fill: #1d4ed8; opacity: 0.08; stroke: #101828; stroke-width: 1.8;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}</style><path class="dg-geo-fill" d="M100 140L140 150L110 112Z"/><path class="dg-geo-fill" d="M98.7 96.6L158.1 67.7L82.2 52Z"/><path class="dg-dash-thin" d="M60 150L100 140"/><path class="dg-dash-thin" d="M60 150L98.7 96.6"/><path class="dg-arc" d="M89.1 142.7A30 30 0 0 0 77.6 125.7"/><text class="dg-lbl-sm" x="94.8" y="126.5" text-anchor="middle" dominant-baseline="central">θ</text><path class="dg-ink" d="M56 146L64 154"/><path class="dg-ink" d="M56 154L64 146"/><text class="dg-lbl-math" x="60" y="163" text-anchor="middle" dominant-baseline="central">Ω</text><text class="dg-lbl-math" x="106" y="152" text-anchor="middle" dominant-baseline="central">M</text><text class="dg-lbl-math" x="108.7" y="90.6" text-anchor="middle" dominant-baseline="central">M′</text><text class="dg-lbl-xs" x="200" y="190" text-anchor="middle" dominant-baseline="central">ΩM′ = k × ΩM et (ΩM, ΩM′) = θ</text></svg>
