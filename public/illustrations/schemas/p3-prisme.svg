<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 198" width="300" height="198" role="img" aria-label="La lumière blanche qui traverse un prisme est déviée et décomposée en un spectre de couleurs, du rouge (le moins dévié) au violet (le plus dévié)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ray-head{fill: #f79009;}.dg-prism{fill: #eff8ff; stroke: #101828; stroke-width: 1.5;}.dg-ray-white{fill: none; stroke: #667085; stroke-width: 3;}.dg-sp-red,.dg-sp-orange,.dg-sp-yellow,.dg-sp-green,.dg-sp-blue,.dg-sp-indigo,.dg-sp-violet{fill: none; stroke-width: 2.2;}.dg-sp-red{stroke: #e31b23;}.dg-sp-orange{stroke: #f97316;}.dg-sp-yellow{stroke: #f79009;}.dg-sp-green{stroke: #12b76a;}.dg-sp-blue{stroke: #2e90fa;}.dg-sp-indigo{stroke: #4338ca;}.dg-sp-violet{stroke: #6d28d9;}</style><path class="dg-prism" d="M120 150L170 40L220 150Z"/><path class="dg-ray-white" d="M10 112L146 96"/><path class="dg-ray-head" d="M80.7 103.7L73.8 107.8L73.1 101.3Z"/><path class="dg-sp-red" d="M146 96L196 100L290 110"/><path class="dg-sp-orange" d="M146 96L196 102L290 121"/><path class="dg-sp-yellow" d="M146 96L196 104L290 132"/><path class="dg-sp-green" d="M146 96L196 106L290 143"/><path class="dg-sp-blue" d="M146 96L196 108L290 154"/><path class="dg-sp-indigo" d="M146 96L196 110L290 165"/><path class="dg-sp-violet" d="M146 96L196 112L290 176"/><text class="dg-lbl-xs" x="296" y="96" text-anchor="end" dominant-baseline="central">rouge (le moins dévié)</text><text class="dg-lbl-xs" x="292" y="192" text-anchor="end" dominant-baseline="central">violet (le plus dévié)</text><text class="dg-lbl-xs" x="14" y="130" text-anchor="start" dominant-baseline="central">lumière blanche</text><text class="dg-lbl-xs" x="170" y="166" text-anchor="middle" dominant-baseline="central">prisme</text></svg>
