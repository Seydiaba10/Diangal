<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 204" width="300" height="204" role="img" aria-label="Profil d’un sol, de haut en bas : litière, horizon riche en humus, horizon d’accumulation, roche altérée, roche mère."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}.dg-t-pink{fill: #fff4ed; stroke: #f97316;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><rect class="dg-t-green" x="30" y="14" width="100" height="12"/><path class="dg-leader" d="M130 20L150 20"/><circle class="dg-pt" cx="130" cy="20" r="1.8"/><text class="dg-lbl-sm" x="153" y="20" text-anchor="start" dominant-baseline="central">litière (feuilles mortes)</text><rect class="dg-t-sand" x="30" y="26" width="100" height="40"/><path class="dg-leader" d="M130 46L150 46"/><circle class="dg-pt" cx="130" cy="46" r="1.8"/><text class="dg-lbl-sm" x="153" y="46" text-anchor="start" dominant-baseline="central">horizon humifère (humus)</text><rect class="dg-t-pink" x="30" y="66" width="100" height="46"/><path class="dg-leader" d="M130 89L150 89"/><circle class="dg-pt" cx="130" cy="89" r="1.8"/><text class="dg-lbl-sm" x="153" y="89" text-anchor="start" dominant-baseline="central">horizon d’accumulation</text><rect class="dg-t-yellow" x="30" y="112" width="100" height="42"/><path class="dg-leader" d="M130 133L150 133"/><circle class="dg-pt" cx="130" cy="133" r="1.8"/><text class="dg-lbl-sm" x="153" y="133" text-anchor="start" dominant-baseline="central">roche altérée (fragments)</text><rect class="dg-t-grey" x="30" y="154" width="100" height="34"/><path class="dg-leader" d="M130 171L150 171"/><circle class="dg-pt" cx="130" cy="171" r="1.8"/><text class="dg-lbl-sm" x="153" y="171" text-anchor="start" dominant-baseline="central">roche mère</text><rect class="dg-t-grey" x="50" y="124" width="12" height="8" rx="2"/><rect class="dg-t-grey" x="80" y="134" width="12" height="8" rx="2"/><rect class="dg-t-grey" x="108" y="122" width="12" height="8" rx="2"/><rect class="dg-t-grey" x="64" y="144" width="12" height="8" rx="2"/><rect class="dg-t-grey" x="96" y="148" width="12" height="8" rx="2"/><path class="dg-ink-thin" d="M70 26C66 40 74 52 68 64M98 26C102 44 94 54 100 70"/><path class="dg-ink" d="M16 186L16 34.2"/><path class="dg-pt" d="M16 30L18.9 36.4L13.1 36.4Z"/><text class="dg-lbl-xs" x="22" y="196" text-anchor="start" dominant-baseline="central">le sol se forme à partir de la roche</text></svg>
