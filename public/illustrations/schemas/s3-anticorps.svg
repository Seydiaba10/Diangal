<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 162" width="300" height="162" role="img" aria-label="Un anticorps en forme de Y reconnaît un seul antigène, qui s’emboîte comme une clé dans sa serrure ; il ne se fixe pas sur un autre antigène."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-antibody{fill: none; stroke: #6d28d9; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;}</style><path class="dg-antibody" d="M80 120V84L56 50M80 84L104 50"/><path class="dg-antibody" d="M220 120V84L196 50M220 84L244 50"/><path class="dg-t-red" d="M44 44L56 28L68 44L62 52L50 52Z"/><text class="dg-lbl-xs" x="56" y="18" text-anchor="middle" dominant-baseline="central">antigène reconnu</text><circle class="dg-t-blue" cx="184" cy="40" r="11"/><text class="dg-lbl-xs" x="184" y="18" text-anchor="middle" dominant-baseline="central">autre antigène</text><text class="dg-lbl-xs" x="80" y="140" text-anchor="middle" dominant-baseline="central">anticorps : il se fixe</text><text class="dg-lbl-xs" x="80" y="152" text-anchor="middle" dominant-baseline="central">sur son antigène</text><text class="dg-lbl-xs" x="220" y="140" text-anchor="middle" dominant-baseline="central">il ne se fixe pas</text><text class="dg-lbl-xs" x="220" y="152" text-anchor="middle" dominant-baseline="central">sur un autre</text></svg>
