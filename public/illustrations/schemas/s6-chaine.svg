<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 258" width="300" height="258" role="img" aria-label="Chaîne alimentaire : herbe → criquet → lézard → serpent → aigle. Chaque flèche se lit « est mangé par ». L’herbe est le producteur ; les décomposeurs recyclent la matière morte."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-head-cell,.dg-cell,.dg-cell-hi{fill: #f5f7f9; stroke: #101828; stroke-width: 1;}.dg-cell{fill: #ffffff;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}</style><rect class="dg-t-green" x="90" y="12" width="120" height="26" rx="8"/><text class="dg-lbl" x="150" y="25" text-anchor="middle" dominant-baseline="central">herbe</text><text class="dg-lbl-xs" x="216" y="25" text-anchor="start" dominant-baseline="central">producteur</text><path class="dg-ink" d="M150 39L150 58.8"/><path class="dg-pt" d="M150 63L147.1 56.6L152.9 56.6Z"/><rect class="dg-cell" x="90" y="52" width="120" height="26" rx="8"/><text class="dg-lbl" x="150" y="65" text-anchor="middle" dominant-baseline="central">criquet</text><text class="dg-lbl-xs" x="216" y="65" text-anchor="start" dominant-baseline="central">consommateur 1</text><path class="dg-ink" d="M150 79L150 98.8"/><path class="dg-pt" d="M150 103L147.1 96.6L152.9 96.6Z"/><rect class="dg-cell" x="90" y="92" width="120" height="26" rx="8"/><text class="dg-lbl" x="150" y="105" text-anchor="middle" dominant-baseline="central">lézard</text><text class="dg-lbl-xs" x="216" y="105" text-anchor="start" dominant-baseline="central">consommateur 2</text><path class="dg-ink" d="M150 119L150 138.8"/><path class="dg-pt" d="M150 143L147.1 136.6L152.9 136.6Z"/><rect class="dg-cell" x="90" y="132" width="120" height="26" rx="8"/><text class="dg-lbl" x="150" y="145" text-anchor="middle" dominant-baseline="central">serpent</text><text class="dg-lbl-xs" x="216" y="145" text-anchor="start" dominant-baseline="central">consommateur 3</text><path class="dg-ink" d="M150 159L150 178.8"/><path class="dg-pt" d="M150 183L147.1 176.6L152.9 176.6Z"/><rect class="dg-cell" x="90" y="172" width="120" height="26" rx="8"/><text class="dg-lbl" x="150" y="185" text-anchor="middle" dominant-baseline="central">aigle</text><text class="dg-lbl-xs" x="216" y="185" text-anchor="start" dominant-baseline="central">consommateur 4</text><text class="dg-lbl-xs" x="150" y="214" text-anchor="middle" dominant-baseline="central">chaque flèche se lit « est mangé par »</text><rect class="dg-t-sand" x="8" y="226" width="284" height="26" rx="8"/><text class="dg-lbl-xs" x="150" y="239" text-anchor="middle" dominant-baseline="central">décomposeurs : bactéries, champignons, vers de terre</text></svg>
