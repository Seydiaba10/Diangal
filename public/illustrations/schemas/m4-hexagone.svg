<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Hexagone régulier inscrit dans un cercle : six angles au centre de 60° ; chaque côté est égal au rayon."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-geo-line{stroke: #1d4ed8; stroke-width: 1.4;}.dg-geo-fill{fill: #1d4ed8; opacity: 0.08; stroke: #101828; stroke-width: 1.8;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}</style><circle class="dg-geo-line" cx="150" cy="98" r="80"/><path class="dg-geo-fill" d="M230 98L190 28.7L110 28.7L70 98L110 167.3L190 167.3Z"/><path class="dg-geo" d="M150 98L230 98"/><path class="dg-geo" d="M150 98L190 28.7"/><path class="dg-arc" d="M172 98A22 22 0 0 0 161 78.9"/><text class="dg-lbl-sm" x="180.3" y="80.5" text-anchor="middle" dominant-baseline="central">60°</text><path class="dg-ink" d="M205.7 65.9L214.3 60.9"/><path class="dg-ink" d="M190 93L190 103"/><path class="dg-ink" d="M165.7 60.9L174.3 65.9"/><circle class="dg-pt" cx="150" cy="98" r="2.8"/><text class="dg-lbl-math" x="150" y="111" text-anchor="middle" dominant-baseline="central">O</text><text class="dg-lbl-xs" x="150" y="192" text-anchor="middle" dominant-baseline="central">côté = rayon ; angle au centre 360° ÷ 6 = 60°</text></svg>
