<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 170" width="300" height="170" role="img" aria-label="Bandes de même longueur : 2/3 couvre autant que 8/12, 3/4 autant que 9/12 ; 8 douzièmes sont moins que 9 douzièmes, donc 2/3 est plus petit que 3/4."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-head-cell,.dg-cell,.dg-cell-hi{fill: #f5f7f9; stroke: #101828; stroke-width: 1;}.dg-cell{fill: #ffffff;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}</style><text class="dg-lbl-math" x="30" y="22" text-anchor="middle" dominant-baseline="central">2/3</text><rect class="dg-t-blue" x="60" y="10" width="73.3" height="24"/><rect class="dg-t-blue" x="133.3" y="10" width="73.3" height="24"/><rect class="dg-cell" x="206.7" y="10" width="73.3" height="24"/><text class="dg-lbl-math" x="30" y="56" text-anchor="middle" dominant-baseline="central">8/12</text><rect class="dg-t-blue" x="60" y="44" width="18.3" height="24"/><rect class="dg-t-blue" x="78.3" y="44" width="18.3" height="24"/><rect class="dg-t-blue" x="96.7" y="44" width="18.3" height="24"/><rect class="dg-t-blue" x="115" y="44" width="18.3" height="24"/><rect class="dg-t-blue" x="133.3" y="44" width="18.3" height="24"/><rect class="dg-t-blue" x="151.7" y="44" width="18.3" height="24"/><rect class="dg-t-blue" x="170" y="44" width="18.3" height="24"/><rect class="dg-t-blue" x="188.3" y="44" width="18.3" height="24"/><rect class="dg-cell" x="206.7" y="44" width="18.3" height="24"/><rect class="dg-cell" x="225" y="44" width="18.3" height="24"/><rect class="dg-cell" x="243.3" y="44" width="18.3" height="24"/><rect class="dg-cell" x="261.7" y="44" width="18.3" height="24"/><text class="dg-lbl-math" x="30" y="96" text-anchor="middle" dominant-baseline="central">3/4</text><rect class="dg-t-red" x="60" y="84" width="55" height="24"/><rect class="dg-t-red" x="115" y="84" width="55" height="24"/><rect class="dg-t-red" x="170" y="84" width="55" height="24"/><rect class="dg-cell" x="225" y="84" width="55" height="24"/><text class="dg-lbl-math" x="30" y="130" text-anchor="middle" dominant-baseline="central">9/12</text><rect class="dg-t-red" x="60" y="118" width="18.3" height="24"/><rect class="dg-t-red" x="78.3" y="118" width="18.3" height="24"/><rect class="dg-t-red" x="96.7" y="118" width="18.3" height="24"/><rect class="dg-t-red" x="115" y="118" width="18.3" height="24"/><rect class="dg-t-red" x="133.3" y="118" width="18.3" height="24"/><rect class="dg-t-red" x="151.7" y="118" width="18.3" height="24"/><rect class="dg-t-red" x="170" y="118" width="18.3" height="24"/><rect class="dg-t-red" x="188.3" y="118" width="18.3" height="24"/><rect class="dg-t-red" x="206.7" y="118" width="18.3" height="24"/><rect class="dg-cell" x="225" y="118" width="18.3" height="24"/><rect class="dg-cell" x="243.3" y="118" width="18.3" height="24"/><rect class="dg-cell" x="261.7" y="118" width="18.3" height="24"/><path class="dg-dash" d="M206.7 4L206.7 148"/><text class="dg-lbl-sm" x="170" y="160" text-anchor="middle" dominant-baseline="central">2/3 = 8/12 et 3/4 = 9/12, donc 2/3 &lt; 3/4</text></svg>
