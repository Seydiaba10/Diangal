<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 244.2" width="300" height="244.2" role="img" aria-label="Classification de quelques couples oxydant/réducteur par leur potentiel standard : en haut les oxydants les plus forts, en bas les réducteurs les plus forts. La flèche en gamma montre que Cu²⁺ réagit avec Zn."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-red-fill{fill: #f04438;}.dg-blue-fill{fill: #2e90fa;}.dg-red-line,.dg-blue-line,.dg-green-line,.dg-yellow-line{fill: none; stroke: #f04438; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;}.dg-blue-line{stroke: #2e90fa;}.dg-gamma{fill: none; stroke: #12b76a; stroke-width: 2; stroke-dasharray: 5 3;}</style><path class="dg-axis-line" d="M150 26L150 224.2"/><path class="dg-axis-line" d="M144 40L156 40"/><text class="dg-lbl-sm" x="136" y="40" text-anchor="end" dominant-baseline="central">Ag⁺</text><text class="dg-lbl-sm" x="164" y="40" text-anchor="start" dominant-baseline="central">Ag</text><text class="dg-tick" x="230" y="40" text-anchor="start" dominant-baseline="central">0,8 V</text><path class="dg-axis-line" d="M144 72.2L156 72.2"/><text class="dg-lbl-sm" x="136" y="72.2" text-anchor="end" dominant-baseline="central">Cu²⁺</text><text class="dg-lbl-sm" x="164" y="72.2" text-anchor="start" dominant-baseline="central">Cu</text><text class="dg-tick" x="230" y="72.2" text-anchor="start" dominant-baseline="central">0,34 V</text><path class="dg-axis-line" d="M144 96L156 96"/><text class="dg-lbl-sm" x="136" y="96" text-anchor="end" dominant-baseline="central">H⁺</text><text class="dg-lbl-sm" x="164" y="96" text-anchor="start" dominant-baseline="central">H₂</text><text class="dg-tick" x="230" y="96" text-anchor="start" dominant-baseline="central">0 V</text><path class="dg-axis-line" d="M144 126.8L156 126.8"/><text class="dg-lbl-sm" x="136" y="126.8" text-anchor="end" dominant-baseline="central">Fe²⁺</text><text class="dg-lbl-sm" x="164" y="126.8" text-anchor="start" dominant-baseline="central">Fe</text><text class="dg-tick" x="230" y="126.8" text-anchor="start" dominant-baseline="central">−0,44 V</text><path class="dg-axis-line" d="M144 149.2L156 149.2"/><text class="dg-lbl-sm" x="136" y="149.2" text-anchor="end" dominant-baseline="central">Zn²⁺</text><text class="dg-lbl-sm" x="164" y="149.2" text-anchor="start" dominant-baseline="central">Zn</text><text class="dg-tick" x="230" y="149.2" text-anchor="start" dominant-baseline="central">−0,76 V</text><path class="dg-axis-line" d="M144 212.2L156 212.2"/><text class="dg-lbl-sm" x="136" y="212.2" text-anchor="end" dominant-baseline="central">Al³⁺</text><text class="dg-lbl-sm" x="164" y="212.2" text-anchor="start" dominant-baseline="central">Al</text><text class="dg-tick" x="230" y="212.2" text-anchor="start" dominant-baseline="central">−1,66 V</text><path class="dg-red-line" d="M40 212.2L40 34.8"/><path class="dg-red-fill" d="M40 30L43.3 37.3L36.7 37.3Z"/><text class="dg-lbl-xs" x="8" y="22" text-anchor="start" dominant-baseline="central">oxydants plus forts</text><path class="dg-blue-line" d="M276 30L276 207.4"/><path class="dg-blue-fill" d="M276 212.2L272.7 204.9L279.3 204.9Z"/><text class="dg-lbl-xs" x="270" y="230.2" text-anchor="end" dominant-baseline="central">réducteurs plus forts</text><path class="dg-gamma" d="M118 72.2L182 149.2"/><text class="dg-lbl-xs" x="150" y="14" text-anchor="middle" dominant-baseline="central">E° (en volts)</text></svg>
