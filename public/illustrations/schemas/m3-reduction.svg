<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 208" width="300" height="208" role="img" aria-label="Un cône de 120 cm³ coupé à mi-hauteur : le petit cône est une réduction de rapport ½ ; son volume est 120 × (½)³ = 15 cm³."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-solid-face,.dg-solid-face-top,.dg-solid-face-side{fill: #eff8ff; stroke: #101828; stroke-width: 1.6; stroke-linejoin: round;}.dg-hidden,.dg-hidden-thin{fill: none; stroke: #667085; stroke-width: 1.3; stroke-dasharray: 4 3;}.dg-section{fill: #fffaeb; stroke: #b54708; stroke-width: 1.5;}</style><path class="dg-solid-face" d="M80 170L150 20L220 170A70 18 0 0 1 80 170Z"/><path class="dg-hidden" d="M80 170A70 18 0 0 1 220 170"/><path class="dg-hidden" d="M150 20L150 170"/><path class="dg-hidden" d="M150 170L220 170"/><ellipse class="dg-section" cx="150" cy="95" rx="35" ry="9"/><text class="dg-lbl-xs" x="196" y="95" text-anchor="start" dominant-baseline="central">mi-hauteur : k = ½</text><text class="dg-lbl-sm" x="150" y="198" text-anchor="middle" dominant-baseline="central">petit cône : 120 × (½)³ = 15 cm³</text></svg>
