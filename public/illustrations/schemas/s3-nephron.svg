<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 232" width="300" height="232" role="img" aria-label="Un néphron (schéma) : le sang est filtré dans le glomérule ; le long du tube, l’eau, le glucose et une partie des sels retournent dans le sang (réabsorption) et quelques déchets y sont ajoutés (sécrétion) ; il reste l’urine."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-pink{fill: #fff4ed; stroke: #f97316;}.dg-red-fill{fill: #f04438;}.dg-blue-fill{fill: #2e90fa;}.dg-red-line,.dg-blue-line,.dg-green-line,.dg-yellow-line{fill: none; stroke: #f04438; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;}.dg-blue-line{stroke: #2e90fa;}.dg-yellow-line{stroke: #f79009;}.dg-bronchiole,.dg-ureter,.dg-tubule{fill: none; stroke: #f97316; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round;}.dg-tubule{stroke: #f79009; stroke-width: 10; opacity: 0.8;}.dg-capillary-red-fill{fill: none; stroke: #f04438; stroke-width: 3;}</style><circle class="dg-t-pink" cx="60" cy="60" r="26"/><path class="dg-capillary-red-fill" d="M48 52c4-8 12-8 14 0s10 8 12 0-4 16-12 14-18-2-14-14z"/><path class="dg-tubule" d="M80 72C110 80 120 60 140 70C160 80 150 110 170 120C190 130 200 100 220 110V200"/><path class="dg-red-line" d="M68 18L61.4 36.1"/><path class="dg-red-fill" d="M60 40L59.5 33L64.9 35Z"/><text class="dg-lbl-xs" x="74" y="14" text-anchor="start" dominant-baseline="central">sang à filtrer</text><path class="dg-blue-line" d="M150 130L132.3 156.5"/><path class="dg-blue-fill" d="M130 160L131.2 153.1L135.9 156.3Z"/><text class="dg-lbl-xs" x="126" y="176" text-anchor="end" dominant-baseline="central">réabsorption (eau, glucose…)</text><path class="dg-yellow-line" d="M222 200L222 221.8"/><path class="dg-yellow-line" d="M222 226L219.1 219.6L224.9 219.6Z"/><text class="dg-lbl-xs" x="230" y="220" text-anchor="start" dominant-baseline="central">urine</text><path class="dg-leader" d="M60 60L77.5 110"/><circle class="dg-pt" cx="60" cy="60" r="1.8"/><text class="dg-lbl-xs" x="75.5" y="104" text-anchor="end" dominant-baseline="central">1. filtration</text><text class="dg-lbl-xs" x="75.5" y="116" text-anchor="end" dominant-baseline="central">(glomérule)</text><path class="dg-leader" d="M140 70L198 40"/><circle class="dg-pt" cx="140" cy="70" r="1.8"/><text class="dg-lbl-xs" x="200" y="40" text-anchor="start" dominant-baseline="central">2. tube urinaire</text><path class="dg-leader" d="M196 106L228 140"/><circle class="dg-pt" cx="196" cy="106" r="1.8"/><text class="dg-lbl-xs" x="230" y="140" text-anchor="start" dominant-baseline="central">3. sécrétion</text></svg>
