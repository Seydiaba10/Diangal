<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 198" width="300" height="198" role="img" aria-label="Construction d’un triangle de côtés 5 cm, 4 cm et 3 cm : on trace [AB], puis un arc de centre A et de rayon 4 cm et un arc de centre B et de rayon 3 cm ; ils se coupent en C."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-pt{fill: #101828;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-compass{fill: none; stroke: #98a2b3; stroke-width: 1.2;}</style><path class="dg-compass" d="M172.6801194468061 114.03585162283562A144 144 0 0 0 130.87601588718348 58.29704687667217"/><path class="dg-compass" d="M185.07060605806953 67.80441575660214A108 108 0 0 0 131.6724694300786 107.8530182275953"/><path class="dg-geo" d="M40 170L220 170L155.2 83.6Z"/><circle class="dg-pt" cx="40" cy="170" r="2.8"/><text class="dg-lbl-math" x="30" y="181" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="220" cy="170" r="2.8"/><text class="dg-lbl-math" x="230" y="181" text-anchor="middle" dominant-baseline="central">B</text><circle class="dg-pt" cx="155.2" cy="83.6" r="2.8"/><text class="dg-lbl-math" x="155.2" y="71.6" text-anchor="middle" dominant-baseline="central">C</text><text class="dg-lbl-sm" x="130" y="186" text-anchor="middle" dominant-baseline="central">AB = 5 cm</text><text class="dg-lbl-sm" x="71.6" y="126.8" text-anchor="middle" dominant-baseline="central">4 cm</text><text class="dg-lbl-sm" x="211.6" y="126.8" text-anchor="middle" dominant-baseline="central">3 cm</text></svg>
