<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 206" width="300" height="206" role="img" aria-label="La révolution de la Terre autour du Soleil en 365 jours : son axe incliné garde toujours la même direction, ce qui explique les saisons (dates pour l’hémisphère nord ; tailles et distances non respectées)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-dash-thin{fill: none; stroke: #98a2b3; stroke-width: 1; stroke-dasharray: 3 3;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-night{fill: #101828; opacity: 0.45;}</style><ellipse class="dg-dash-thin" cx="150" cy="100" rx="120" ry="58"/><circle class="dg-t-yellow" cx="150" cy="100" r="18"/><text class="dg-lbl-xs" x="150" y="130" text-anchor="middle" dominant-baseline="central">Soleil</text><circle class="dg-t-blue" cx="30" cy="100" r="13"/><path class="dg-night" d="M30 87A13 13 0 0 0 30 113Z"/><path class="dg-ink" d="M23 118L37 82"/><text class="dg-lbl-xs" x="30" y="76" text-anchor="middle" dominant-baseline="central">21 juin</text><circle class="dg-t-blue" cx="270" cy="100" r="13"/><path class="dg-night" d="M270 87A13 13 0 0 1 270 113Z"/><path class="dg-ink" d="M263 118L277 82"/><text class="dg-lbl-xs" x="270" y="76" text-anchor="middle" dominant-baseline="central">21 décembre</text><circle class="dg-t-blue" cx="150" cy="42" r="13"/><path class="dg-night" d="M137 42A13 13 0 0 1 163 42Z"/><path class="dg-ink" d="M143 60L157 24"/><text class="dg-lbl-xs" x="150" y="18" text-anchor="middle" dominant-baseline="central">21 mars</text><circle class="dg-t-blue" cx="150" cy="158" r="13"/><path class="dg-night" d="M137 158A13 13 0 0 0 163 158Z"/><path class="dg-ink" d="M143 176L157 140"/><text class="dg-lbl-xs" x="150" y="184" text-anchor="middle" dominant-baseline="central">23 septembre</text><text class="dg-lbl-xs" x="150" y="196" text-anchor="middle" dominant-baseline="central">l’axe de la Terre, incliné, garde la même direction</text></svg>
