<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 230" width="300" height="230" role="img" aria-label="Cercle trigonométrique de rayon 1 : le point associé à π/3 a pour abscisse cos(π/3) = 1/2 et pour ordonnée sin(π/3) = √3/2."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}</style><path class="dg-axis-line" d="M4 120L221.8 120"/><path class="dg-pt" d="M226 120L219.6 122.9L219.6 117.1Z"/><path class="dg-axis-line" d="M110 226L110 10.2"/><path class="dg-pt" d="M110 6L112.9 12.4L107.1 12.4Z"/><circle class="dg-geo" cx="110" cy="120" r="96"/><circle class="dg-pt" cx="193.1" cy="72" r="3"/><text class="dg-lbl-xs" x="207.1" y="66" text-anchor="start" dominant-baseline="central">π/6</text><circle class="dg-pt" cx="177.9" cy="52.1" r="3"/><text class="dg-lbl-xs" x="191.9" y="46.1" text-anchor="start" dominant-baseline="central">π/4</text><circle class="dg-pt" cx="158" cy="36.9" r="3"/><text class="dg-lbl-xs" x="172" y="30.9" text-anchor="start" dominant-baseline="central">π/3</text><circle class="dg-pt" cx="110" cy="24" r="3"/><text class="dg-lbl-xs" x="124" y="18" text-anchor="start" dominant-baseline="central">π/2</text><path class="dg-vec" d="M110 120L158 36.9"/><path class="dg-dash" d="M158 36.9L158 120"/><path class="dg-dash" d="M158 36.9L110 36.9"/><path class="dg-arc" d="M132 120A22 22 0 0 0 121 100.9"/><text class="dg-lbl-xs" x="158" y="132" text-anchor="middle" dominant-baseline="central">cos = 1/2</text><text class="dg-lbl-xs" x="104" y="36.9" text-anchor="end" dominant-baseline="central">sin = √3/2</text><text class="dg-tick" x="212" y="132" text-anchor="middle" dominant-baseline="central">1</text><text class="dg-tick" x="102" y="22" text-anchor="middle" dominant-baseline="central">1</text><text class="dg-tick" x="102" y="132" text-anchor="middle" dominant-baseline="central">O</text><text class="dg-lbl-xs" x="250" y="210" text-anchor="middle" dominant-baseline="central">angle π/3 (60°)</text></svg>
