<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 198" width="300" height="198" role="img" aria-label="Une balançoire en équilibre : 300 N à 2 m de l’axe et 400 N à 1,5 m ont des moments égaux (600 N·m) de part et d’autre."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><rect class="dg-t-sand" x="30" y="92" width="240" height="8" rx="3"/><path class="dg-t-grey" d="M150 100l-14 30h28z"/><circle class="dg-pt" cx="150" cy="96" r="3"/><path class="dg-vec" d="M50 100L50 144.6"/><path class="dg-vec-head" d="M50 150L46.3 141.8L53.7 141.8Z"/><text class="dg-lbl-sm" x="50" y="162" text-anchor="middle" dominant-baseline="central">300 N</text><path class="dg-vec" d="M225 100L225 144.6"/><path class="dg-vec-head" d="M225 150L221.3 141.8L228.7 141.8Z"/><text class="dg-lbl-sm" x="225" y="162" text-anchor="middle" dominant-baseline="central">400 N</text><path class="dg-ink-thin" d="M50 74H150"/><text class="dg-lbl-xs" x="100" y="64" text-anchor="middle" dominant-baseline="central">2 m</text><path class="dg-ink-thin" d="M150 74H225"/><text class="dg-lbl-xs" x="187.5" y="64" text-anchor="middle" dominant-baseline="central">1,5 m</text><text class="dg-lbl-sm" x="150" y="188" text-anchor="middle" dominant-baseline="central">300 × 2 = 400 × 1,5 = 600 N·m : équilibre</text></svg>
