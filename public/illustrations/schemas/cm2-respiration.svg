<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 320 170" width="320" height="170" role="img" aria-label="Le trajet de l’air : le nez ou la bouche, la trachée, les bronches, les poumons."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-arrow{fill: none; stroke: #e31b23; stroke-width: 2;}.dg-note{fill: #e8f5ed; stroke: #006b32; stroke-width: 2;}.dg-axis{fill: currentColor; font-size: 12px; font-weight: 600;}</style><rect class="dg-note" x="60" y="10" width="200" height="28" rx="8"/><text class="dg-axis" x="160" y="24" text-anchor="middle" dominant-baseline="central">le nez ou la bouche</text><path class="dg-arrow" d="M160 38V50m-5-6 5 6 5-6"/><rect class="dg-note" x="60" y="50" width="200" height="28" rx="8"/><text class="dg-axis" x="160" y="64" text-anchor="middle" dominant-baseline="central">la trachée</text><path class="dg-arrow" d="M160 78V90m-5-6 5 6 5-6"/><rect class="dg-note" x="60" y="90" width="200" height="28" rx="8"/><text class="dg-axis" x="160" y="104" text-anchor="middle" dominant-baseline="central">les bronches</text><path class="dg-arrow" d="M160 118V130m-5-6 5 6 5-6"/><rect class="dg-note" x="60" y="130" width="200" height="28" rx="8"/><text class="dg-axis" x="160" y="144" text-anchor="middle" dominant-baseline="central">les poumons (alvéoles)</text></svg>
