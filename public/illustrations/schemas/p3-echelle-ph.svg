<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 122" width="300" height="122" role="img" aria-label="Échelle de pH de 0 à 14 : en dessous de 7, la solution est acide (jus de citron, vers 2) ; à 7, elle est neutre (eau pure) ; au-dessus de 7, elle est basique (eau de javel, vers 12)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-ph-0,.dg-ph-1,.dg-ph-2{fill: #e31b23;}.dg-ph-3{fill: #f97316;}.dg-ph-4{fill: #f79009;}.dg-ph-5,.dg-ph-6{fill: #fdef42;}.dg-ph-7{fill: #12b76a;}.dg-ph-8{fill: #15803d;}.dg-ph-9{fill: #0f766e;}.dg-ph-10{fill: #2e90fa;}.dg-ph-11{fill: #1d4ed8;}.dg-ph-12{fill: #4338ca;}.dg-ph-13,.dg-ph-14{fill: #6d28d9;}</style><rect class="dg-ph-0" x="10" y="40" width="19" height="26"/><text class="dg-tick" x="19.5" y="78" text-anchor="middle" dominant-baseline="central">0</text><rect class="dg-ph-1" x="29" y="40" width="19" height="26"/><text class="dg-tick" x="38.5" y="78" text-anchor="middle" dominant-baseline="central">1</text><rect class="dg-ph-2" x="48" y="40" width="19" height="26"/><text class="dg-tick" x="57.5" y="78" text-anchor="middle" dominant-baseline="central">2</text><rect class="dg-ph-3" x="67" y="40" width="19" height="26"/><text class="dg-tick" x="76.5" y="78" text-anchor="middle" dominant-baseline="central">3</text><rect class="dg-ph-4" x="86" y="40" width="19" height="26"/><text class="dg-tick" x="95.5" y="78" text-anchor="middle" dominant-baseline="central">4</text><rect class="dg-ph-5" x="105" y="40" width="19" height="26"/><text class="dg-tick" x="114.5" y="78" text-anchor="middle" dominant-baseline="central">5</text><rect class="dg-ph-6" x="124" y="40" width="19" height="26"/><text class="dg-tick" x="133.5" y="78" text-anchor="middle" dominant-baseline="central">6</text><rect class="dg-ph-7" x="143" y="40" width="19" height="26"/><text class="dg-tick" x="152.5" y="78" text-anchor="middle" dominant-baseline="central">7</text><rect class="dg-ph-8" x="162" y="40" width="19" height="26"/><text class="dg-tick" x="171.5" y="78" text-anchor="middle" dominant-baseline="central">8</text><rect class="dg-ph-9" x="181" y="40" width="19" height="26"/><text class="dg-tick" x="190.5" y="78" text-anchor="middle" dominant-baseline="central">9</text><rect class="dg-ph-10" x="200" y="40" width="19" height="26"/><text class="dg-tick" x="209.5" y="78" text-anchor="middle" dominant-baseline="central">10</text><rect class="dg-ph-11" x="219" y="40" width="19" height="26"/><text class="dg-tick" x="228.5" y="78" text-anchor="middle" dominant-baseline="central">11</text><rect class="dg-ph-12" x="238" y="40" width="19" height="26"/><text class="dg-tick" x="247.5" y="78" text-anchor="middle" dominant-baseline="central">12</text><rect class="dg-ph-13" x="257" y="40" width="19" height="26"/><text class="dg-tick" x="266.5" y="78" text-anchor="middle" dominant-baseline="central">13</text><rect class="dg-ph-14" x="276" y="40" width="19" height="26"/><text class="dg-tick" x="285.5" y="78" text-anchor="middle" dominant-baseline="central">14</text><text class="dg-lbl-sm" x="70" y="26" text-anchor="middle" dominant-baseline="central">acide</text><text class="dg-lbl-sm" x="152" y="26" text-anchor="middle" dominant-baseline="central">neutre</text><text class="dg-lbl-sm" x="234" y="26" text-anchor="middle" dominant-baseline="central">basique</text><path class="dg-leader" d="M46 66L44 100"/><circle class="dg-pt" cx="46" cy="66" r="1.8"/><text class="dg-lbl-xs" x="46" y="100" text-anchor="start" dominant-baseline="central">citron (≈ 2)</text><path class="dg-leader" d="M152 66L152 112"/><circle class="dg-pt" cx="152" cy="66" r="1.8"/><text class="dg-lbl-xs" x="150" y="112" text-anchor="end" dominant-baseline="central">eau pure (7)</text><path class="dg-leader" d="M248 66L228 100"/><circle class="dg-pt" cx="248" cy="66" r="1.8"/><text class="dg-lbl-xs" x="230" y="100" text-anchor="start" dominant-baseline="central">javel (≈ 12)</text></svg>
