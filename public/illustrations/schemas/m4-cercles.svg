<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 116" width="300" height="116" role="img" aria-label="Positions de deux cercles selon la distance d de leurs centres : extérieurs (d &gt; r + r′), tangents extérieurement (d = r + r′), sécants, tangents intérieurement (d = r − r′), l’un à l’intérieur de l’autre."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-pt{fill: #101828;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}.dg-geo-line{stroke: #1d4ed8; stroke-width: 1.4;}</style><circle class="dg-geo" cx="16" cy="50" r="15"/><circle class="dg-geo-line" cx="44" cy="50" r="8"/><circle class="dg-pt" cx="16" cy="50" r="1.8"/><circle class="dg-pt" cx="44" cy="50" r="1.8"/><text class="dg-lbl-xs" x="30" y="86" text-anchor="middle" dominant-baseline="central">extérieurs</text><circle class="dg-geo" cx="78.5" cy="50" r="15"/><circle class="dg-geo-line" cx="101.5" cy="50" r="8"/><circle class="dg-pt" cx="78.5" cy="50" r="1.8"/><circle class="dg-pt" cx="101.5" cy="50" r="1.8"/><text class="dg-lbl-xs" x="90" y="86" text-anchor="middle" dominant-baseline="central">tangents ext.</text><circle class="dg-geo" cx="143.5" cy="50" r="15"/><circle class="dg-geo-line" cx="156.5" cy="50" r="8"/><circle class="dg-pt" cx="143.5" cy="50" r="1.8"/><circle class="dg-pt" cx="156.5" cy="50" r="1.8"/><text class="dg-lbl-xs" x="150" y="86" text-anchor="middle" dominant-baseline="central">sécants</text><circle class="dg-geo" cx="206.5" cy="50" r="15"/><circle class="dg-geo-line" cx="213.5" cy="50" r="8"/><circle class="dg-pt" cx="206.5" cy="50" r="1.8"/><circle class="dg-pt" cx="213.5" cy="50" r="1.8"/><text class="dg-lbl-xs" x="210" y="86" text-anchor="middle" dominant-baseline="central">tangents int.</text><circle class="dg-geo" cx="268.5" cy="50" r="15"/><circle class="dg-geo-line" cx="271.5" cy="50" r="8"/><circle class="dg-pt" cx="268.5" cy="50" r="1.8"/><circle class="dg-pt" cx="271.5" cy="50" r="1.8"/><text class="dg-lbl-xs" x="270" y="86" text-anchor="middle" dominant-baseline="central">intérieur</text><text class="dg-lbl-xs" x="150" y="108" text-anchor="middle" dominant-baseline="central">d = distance des centres ; r et r′ : rayons</text></svg>
