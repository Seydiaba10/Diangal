<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 204" width="300" height="204" role="img" aria-label="Solide sur un plan incliné d’angle α, sans frottement : il est soumis à son poids P (vertical) et à la réaction R du plan (perpendiculaire au plan) ; il glisse avec une accélération a = g sin α."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-pt{fill: #101828;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}</style><path class="dg-t-sand" d="M20 170L280 170L20 48.760008879700365Z"/><path class="dg-t-grey" d="M118.873844259267 94.8656396490212L155.126155740733 111.7703701186492L144.13808093547482 88.2063676556963L107.88576945400882 71.3016371860683Z"/><path class="dg-vec" d="M131.5 91.5L131.5 146.1"/><path class="dg-vec-head" d="M131.5 151.5L127.8 143.3L135.2 143.3Z"/><text class="dg-lbl-math" x="139.5" y="147.5" text-anchor="start" dominant-baseline="central">P</text><path class="dg-vec" d="M131.5 91.5L111 47.5"/><path class="dg-vec-head" d="M108.7 42.6L115.5 48.5L108.8 51.6Z"/><text class="dg-lbl-math" x="115" y="39" text-anchor="start" dominant-baseline="central">R</text><path class="dg-ink" d="M164.2 130L205.7 149.4"/><path class="dg-pt" d="M209.5 151.1L202.5 151L204.9 145.8Z"/><text class="dg-lbl-xs" x="186.8" y="156.