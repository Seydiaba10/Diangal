<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 180" width="300" height="180" role="img" aria-label="Osmose : dans l’eau pure, l’eau entre dans le globule rouge, qui éclate ; dans une solution à 9 g/L de sel, rien ne change ; dans une eau très salée, l’eau sort et le globule se ratatine."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-blue-fill{fill: #2e90fa;}.dg-red-line,.dg-blue-line,.dg-green-line,.dg-yellow-line{fill: none; stroke: #f04438; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;}.dg-blue-line{stroke: #2e90fa;}.dg-sea{fill: #eff8ff;}</style><rect class="dg-sea" x="8" y="30" width="88" height="90" rx="8"/><path class="dg-t-red" d="M34 74l6 -10 6 8 8 -10 6 10 6 -6 4 12"/><text class="dg-lbl-xs" x="52" y="136" text-anchor="middle" dominant-baseline="central">eau pure</text><text class="dg-lbl-xs" x="52" y="148" text-anchor="middle" dominant-baseline="central">hémolyse</text><rect class="dg-sea" x="106" y="30" width="88" height="90" rx="8"/><circle class="dg-t-red" cx="150" cy="75" r="20"/><text class="dg-lbl-xs" x="150" y="136" text-anchor="middle" dominant-baseline="central">eau à 9 g/L</text><text class="dg-lbl-xs" x="150" y="148" text-anchor="middle" dominant-baseline="central">pas de changement</text><rect class="dg-sea" x="204" y="30" width="88" height="90" rx="8"/><circle class="dg-t-red" cx="248" cy="75" r="13"/><text class="dg-lbl-xs" x="248" y="136" text-anchor="middle" dominant-baseline="central">eau très salée</text><text class="dg-lbl-xs" x="248" y="148" text-anchor="middle" dominant-baseline="central">le globule se ratatine</text><path class="dg-blue-line" d="M36 52L43.5 59.5"/><path class="dg-blue-fill" d="M46 62L40.4 59.9L43.9 56.4Z"/><path class="dg-blue-line" d="M248 70L259.5 58.5"/><path class="dg-blue-fill" d="M262 56L259.9 61.6L256.4 58.1Z"/><text class="dg-lbl-sm" x="150" y="14" text-anchor="middle" dominant-baseline="central">globules rouges dans trois solutions</text><text class="dg-lbl-xs" x="150" y="170" text-anchor="middle" dominant-baseline="central">l’eau va vers le milieu le plus concentré</text></svg>
