<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 198" width="300" height="198" role="img" aria-label="Électrisation par frottement : une règle frottée se charge et attire de petits morceaux de papier. Deux charges de même signe se repoussent, deux charges de signes contraires s’attirent."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-head-cell,.dg-cell,.dg-cell-hi{fill: #f5f7f9; stroke: #101828; stroke-width: 1;}.dg-cell{fill: #ffffff;}.dg-rod{fill: none; stroke: #b45309; stroke-width: 9; stroke-linecap: round;}.dg-charge{fill: #ffffff; font-size: 13px; font-weight: 700;}</style><path class="dg-rod" d="M30 40L150 90"/><text class="dg-lbl-xs" x="40" y="24" text-anchor="start" dominant-baseline="central">règle frottée (chargée −)</text><text class="dg-charge" x="60" y="56" text-anchor="middle" dominant-baseline="central">−</text><text class="dg-charge" x="86" y="68" text-anchor="middle" dominant-baseline="central">−</text><text class="dg-charge" x="112" y="78" text-anchor="middle" dominant-baseline="central">−</text><text class="dg-charge" x="136" y="88" text-anchor="middle" dominant-baseline="central">−</text><rect class="dg-cell" x="157" y="135" width="14" height="10"/><rect class="dg-cell" x="183" y="145" width="14" height="10"/><rect class="dg-cell" x="207" y="131" width="14" height="10"/><rect class="dg-cell" x="171" y="115" width="14" height="10"/><path class="dg-vec" d="M180 116L163.3 102.6"/><path class="dg-vec-head" d="M160 100L166.8 101.8L163.2 106.2Z"/><text class="dg-lbl-xs" x="212" y="104" text-anchor="start" dominant-baseline="central">morceaux de papier</text><text class="dg-lbl-xs" x="212" y="116" text-anchor="start" dominant-baseline="central">attirés</text><text class="dg-lbl-xs" x="150" y="176" text-anchor="middle" dominant-baseline="central">charges de même signe : répulsion ;</text><text class="dg-lbl-xs" x="150" y="189" text-anchor="middle" dominant-baseline="central">de signes contraires : attraction</text></svg>
