<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 196" width="300" height="196" role="img" aria-label="Réfraction de l’air dans l’eau : un rayon qui arrive avec un angle d’incidence de 50° continue dans l’eau avec un angle de réfraction d’environ 35°, plus près de la normale (sin i = 1,33 × sin r)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-dash-thin{fill: none; stroke: #98a2b3; stroke-width: 1; stroke-dasharray: 3 3;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-ray{stroke: #f79009; stroke-width: 1.8;}.dg-ray-head{fill: #f79009;}.dg-arc{fill: none; stroke: #e31b23; stroke-width: 1.5;}.dg-sea{fill: #eff8ff;}.dg-arc-2{fill: none; stroke: #12b76a; stroke-width: 1.8;}</style><rect class="dg-sea" x="0" y="100" width="300" height="96"/><path class="dg-ink" d="M0 100L300 100"/><path class="dg-dash" d="M150 10L150 190"/><path class="dg-ray" d="M65.7 29.3L150 100"/><path class="dg-ray-head" d="M109.6 66.1L101.9 63.9L106.1 58.9Z"/><path class="dg-ray" d="M150 100L213.4 189.9"/><path class="dg-ray-head" d="M182.9 146.8L176.1 142.7L181.4 138.9Z"/><path class="dg-dash-thin" d="M150 100L218.9 157.9"/><path class="dg-arc" d="M150 66A34 34 0 0 0 123.95448893395475 78.14522127065766"/><path class="dg-arc-2" d="M150 140A40 40 0 0 0 173.03893062011963 132.6987411971977"/><text class="dg-lbl-xs" x="134" y="54" text-anchor="end" dominant-baseline="central">i = 50°</text><text class="dg-lbl-xs" x="174" y="152" text-anchor="start" dominant-baseline="central">r ≈ 35°</text><text class="dg-lbl-sm" x="10" y="90" text-anchor="start" dominant-baseline="central">air</text><text class="dg-lbl-sm" x="10" y="186" text-anchor="start" dominant-baseline="central">eau</text><text class="dg-lbl-xs" x="154" y="14" text-anchor="start" dominant-baseline="central">normale</text><text class="dg-lbl-xs" x="292" y="186" text-anchor="end" dominant-baseline="central">le rayon se rapproche de la normale</text></svg>
