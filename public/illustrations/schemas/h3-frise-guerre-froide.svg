<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 109" width="300" height="109" role="img" aria-label="Frise de la guerre froide (1947-1991) : création de l’OTAN (1949) et du pacte de Varsovie (1955), guerre de Corée, crise de Cuba (1962), chute du mur de Berlin (1989) et fin de l’URSS (1991)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-period,.dg-period-alt{fill: #fffaeb; stroke: #b54708; stroke-width: 1;}.dg-period-alt{fill: #eff8ff; stroke: #175cd3;}</style><rect class="dg-period" x="26.7" y="35" width="235.8" height="10"/><path class="dg-leader" d="M144.6 35L144.6 26"/><text class="dg-lbl-xs" x="144.6" y="20" text-anchor="middle" dominant-baseline="central">guerre froide</text><rect class="dg-period-alt" x="42.8" y="35" width="16.1" height="10"/><path class="dg-leader" d="M50.8 35L50.8 26"/><text class="dg-lbl-xs" x="50.8" y="20" text-anchor="middle" dominant-baseline="central">Corée</text><path class="dg-axis-line" d="M10 40L291.8 40"/><path class="dg-pt" d="M296 40L289.6 42.9L289.6 37.1Z"/><path class="dg-axis-line" d="M16 36L16 44"/><text class="dg-tick" x="16" y="53" text-anchor="middle" dominant-baseline="central">1945</text><path class="dg-axis-line" d="M69.6 36L69.6 44"/><text class="dg-tick" x="69.6" y="53" text-anchor="middle" dominant-baseline="central">1955</text><path class="dg-axis-line" d="M123.2 36L123.2 44"/><text class="dg-tick" x="123.2" y="53" text-anchor="middle" dominant-baseline="central">1965</text><path class="dg-axis-line" d="M176.8 36L176.8 44"/><text class="dg-tick" x="176.8" y="53" text-anchor="middle" dominant-baseline="central">1975</text><path class="dg-axis-line" d="M230.4 36L230.4 44"/><text class="dg-tick" x="230.4" y="53" text-anchor="middle" dominant-baseline="central">1985</text><path class="dg-axis-line" d="M284 36L284 44"/><text class="dg-tick" x="284" y="53" text-anchor="middle" dominant-baseline="central">1995</text><path class="dg-leader" d="M37.4 40L37.4 66"/><circle class="dg-pt" cx="37.4" cy="40" r="3"/><text class="dg-lbl-xs" x="37.4" y="72" text-anchor="middle" dominant-baseline="central">1949 : OTAN</text><path class="dg-leader" d="M69.6 40L71.2 81"/><circle class="dg-pt" cx="69.6" cy="40" r="3"/><text class="dg-lbl-xs" x="71.2" y="87" text-anchor="middle" dominant-baseline="central">1955 : pacte de Varsovie</text><path class="dg-leader" d="M107.1 40L107.1 66"/><circle class="dg-pt" cx="107.1" cy="40" r="3"/><text class="dg-lbl-xs" x="107.1" y="72" text-anchor="middle" dominant-baseline="central">1962 : Cuba</text><path class="dg-leader" d="M251.8 40L214.8 96"/><circle class="dg-pt" cx="251.8" cy="40" r="3"/><text class="dg-lbl-xs" x="214.8" y="102" text-anchor="middle" dominant-baseline="central">1989 : chute du mur de Berlin</text><path class="dg-leader" d="M262.6 40L240 66"/><circle class="dg-pt" cx="262.6" cy="40" r="3"/><text class="dg-lbl-xs" x="240" y="72" text-anchor="middle" dominant-baseline="central">1991 : fin de l’URSS</text></svg>
