<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 202" width="300" height="202" role="img" aria-label="Une cellule animale et une cellule végétale (schémas) : toutes deux ont une membrane, du cytoplasme, un noyau et des mitochondries ; la cellule végétale a en plus une paroi, une grande vacuole et des chloroplastes."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}.dg-t-pink{fill: #fff4ed; stroke: #f97316;}.dg-nucleus{fill: #e4e1f2; stroke: #667085; stroke-width: 1.2;}.dg-mito{fill: #fff4ed; stroke: #f97316; stroke-width: 1.4;}.dg-cell-wall{fill: #e3eed9; stroke: #15803d; stroke-width: 2;}.dg-vacuole{fill: #eff8ff; stroke: #2e90fa; stroke-width: 1.2;}.dg-chloro{fill: #12b76a;}</style><ellipse class="dg-t-pink" cx="76" cy="94" rx="62" ry="54"/><circle class="dg-nucleus" cx="70" cy="92" r="16"/><ellipse class="dg-mito" cx="110" cy="74" rx="9" ry="5"/><ellipse class="dg-mito" cx="46" cy="124" rx="9" ry="5"/><rect class="dg-cell-wall" x="162" y="36" width="128" height="116" rx="6"/><rect class="dg-t-green" x="168" y="42" width="116" height="104" rx="4"/><rect class="dg-vacuole" x="196" y="60" width="76" height="66" rx="18"/><circle class="dg-nucleus" cx="182" cy="128" r="11"/><ellipse class="dg-chloro" cx="178" cy="54" rx="7" ry="4"/><ellipse class="dg-chloro" cx="276" cy="60" rx="7" ry="4"/><ellipse class="dg-chloro" cx="280" cy="134" rx="7" ry="4"/><ellipse class="dg-chloro" cx="226" cy="136" rx="7" ry="4"/><path class="dg-leader" d="M70 92L42 170"/><circle class="dg-pt" cx="70" cy="92" r="1.8"/><text class="dg-lbl-xs" x="40" y="170" text-anchor="end" dominant-baseline="central">noyau</text><path class="dg-leader" d="M130 100L134 170"/><circle class="dg-pt" cx="130" cy="100" r="1.8"/><text class="dg-lbl-xs" x="136" y="170" text-anchor="start" dominant-baseline="central">membrane</text><path class="dg-leader" d="M110 74L118 18"/><circle class="dg-pt" cx="110" cy="74" r="1.8"/><text class="dg-lbl-xs" x="120" y="18" text-anchor="start" dominant-baseline="central">mitochondrie</text><path class="dg-leader" d="M162 90L188 170"/><circle class="dg-pt" cx="162" cy="90" r="1.8"/><text class="dg-lbl-xs" x="190" y="170" text-anchor="start" dominant-baseline="central">paroi</text><path class="dg-leader" d="M234 92L248 170"/><circle class="dg-pt" cx="234" cy="92" r="1.8"/><text class="dg-lbl-xs" x="250" y="170" text-anchor="start" dominant-baseline="central">vacuole</text><path class="dg-leader" d="M276 60L272 18"/><circle class="dg-pt" cx="276" cy="60" r="1.8"/><text class="dg-lbl-xs" x="270" y="18" text-anchor="end" dominant-baseline="central">chloroplaste</text><text class="dg-lbl-sm" x="76" y="194" text-anchor="middle" dominant-baseline="central">cellule animale</text><text class="dg-lbl-sm" x="226" y="194" text-anchor="middle" dominant-baseline="central">cellule végétale</text></svg>
