<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 320 160" width="320" height="160" role="img" aria-label="Une carte : entre A et B, 4 cm ; la barre d’échelle indique 1 cm pour 500 m."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-path{fill: none; stroke: #e31b23; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round;}.dg-land{fill: #e8f5ed; stroke: #006b32; stroke-width: 2; stroke-linejoin: round;}.dg-capital{fill: #e31b23; stroke: #101828; stroke-width: 1.5;}.dg-axis{fill: currentColor; font-size: 12px; font-weight: 600;}.dg-scale{fill: none; stroke: #101828; stroke-width: 4; stroke-linecap: round;}.dg-line{fill: none; stroke: currentColor; stroke-width: 1.5;}.dg-text{fill: currentColor; font-size: 17px; font-weight: 600;}</style><rect class="dg-land" x="10" y="10" width="300" height="100" rx="6"/><circle class="dg-capital" cx="60" cy="60" r="5"/><circle class="dg-capital" cx="220" cy="60" r="5"/><path class="dg-path" d="M60 60H220"/><text class="dg-text" x="60" y="40" text-anchor="middle" dominant-baseline="central">A</text><text class="dg-text" x="220" y="40" text-anchor="middle" dominant-baseline="central">B</text><text class="dg-axis" x="140" y="78" text-anchor="middle" dominant-baseline="central">4 cm sur la carte</text><path class="dg-scale" d="M40 132H80"/><path class="dg-line" d="M40 126V138M80 126V138"/><text class="dg-axis" x="60" y="150" text-anchor="middle" dominant-baseline="central">1 cm = 500 m</text><text class="dg-axis" x="220" y="140" text-anchor="middle" dominant-baseline="central">Échelle 1/50 000</text></svg>
