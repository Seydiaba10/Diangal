<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 250" width="300" height="250" role="img" aria-label="La double circulation : le cœur droit envoie le sang aux poumons, où il se charge en dioxygène, puis il revient au cœur gauche (petite circulation) ; le cœur gauche l’envoie aux organes, d’où il revient au cœur droit (grande circulation)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-pink{fill: #fff4ed; stroke: #f97316;}.dg-t-sand{fill: #ede6dd; stroke: #b45309;}.dg-red-fill{fill: #f04438;}.dg-blue-fill{fill: #2e90fa;}.dg-red-line,.dg-blue-line,.dg-green-line,.dg-yellow-line{fill: none; stroke: #f04438; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;}.dg-blue-line{stroke: #2e90fa;}</style><rect class="dg-t-pink" x="100" y="12" width="100" height="30" rx="10"/><text class="dg-lbl" x="150" y="27" text-anchor="middle" dominant-baseline="central">poumons</text><rect class="dg-t-sand" x="100" y="196" width="100" height="30" rx="10"/><text class="dg-lbl" x="150" y="211" text-anchor="middle" dominant-baseline="central">organes</text><rect class="dg-t-blue" x="110" y="100" width="38" height="40" rx="6"/><rect class="dg-t-red" x="152" y="100" width="38" height="40" rx="6"/><text class="dg-lbl-xs" x="129" y="120" text-anchor="middle" dominant-baseline="central">droit</text><text class="dg-lbl-xs" x="171" y="120" text-anchor="middle" dominant-baseline="central">gauche</text><text class="dg-lbl-sm" x="150" y="92" text-anchor="middle" dominant-baseline="central">cœur</text><path class="dg-blue-line" d="M120 100V70Q120 52 110 42"/><path class="dg-blue-line" d="M116 60L113.2 50"/><path class="dg-blue-fill" d="M112 46L116.5 51.4L111 52.9Z"/><path class="dg-red-line" d="M190 42Q180 52 180 70V100"/><path class="dg-red-line" d="M180 80L180 91.8"/><path class="dg-red-fill" d="M180 96L177.1 89.6L182.9 89.6Z"/><path class="dg-red-line" d="M190 140Q230 150 230 196"/><path class="dg-red-line" d="M228 176L226.5 187.8"/><path class="dg-red-fill" d="M226 192L224 185.3L229.6 186Z"/><path class="dg-blue-line" d="M100 210Q70 180 70 150Q70 132 110 130"/><path class="dg-blue-line" d="M84 136L101.9 131.9"/><path class="dg-blue-fill" d="M106 131L100.4 135.2L99.1 129.6Z"/><text class="dg-lbl-xs" x="250" y="70" text-anchor="middle" dominant-baseline="central">petite</text><text class="dg-lbl-xs" x="250" y="82" text-anchor="middle" dominant-baseline="central">circulation</text><text class="dg-lbl-xs" x="262" y="150" text-anchor="middle" dominant-baseline="central">grande</text><text class="dg-lbl-xs" x="262" y="162" text-anchor="middle" dominant-baseline="central">circulation</text><rect class="dg-red-fill" x="10" y="236" width="14" height="6"/><text class="dg-lbl-xs" x="30" y="239" text-anchor="start" dominant-baseline="central">sang riche en dioxygène</text><rect class="dg-blue-fill" x="160" y="236" width="14" height="6"/><text class="dg-lbl-xs" x="180" y="239" text-anchor="start" dominant-baseline="central">sang pauvre en dioxygène</text></svg>
