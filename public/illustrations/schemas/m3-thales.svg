<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Les deux configurations de Thalès : à gauche, M et N sont sur les côtés [AB] et [AC] ; à droite, sur les droites prolongées au-delà de A. Si (MN) est parallèle à (BC), AM/AB = AN/AC = MN/BC."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-math{fill: currentColor; font-size: 13.5px; font-weight: 600; font-style: italic;}.dg-pt{fill: #101828;}.dg-curve,.dg-curve-alt,.dg-curve-3{fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}.dg-geo,.dg-geo-line{fill: none; stroke: #101828; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round;}</style><path class="dg-geo" d="M70 20L20 160L140 160Z"/><path class="dg-curve" d="M42.5 97L108.5 97"/><circle class="dg-pt" cx="70" cy="20" r="2.8"/><text class="dg-lbl-math" x="70" y="8" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="20" cy="160" r="2.8"/><text class="dg-lbl-math" x="10" y="171" text-anchor="middle" dominant-baseline="central">B</text><circle class="dg-pt" cx="140" cy="160" r="2.8"/><text class="dg-lbl-math" x="150" y="171" text-anchor="middle" dominant-baseline="central">C</text><circle class="dg-pt" cx="42.5" cy="97" r="2.8"/><text class="dg-lbl-math" x="30.5" y="97" text-anchor="middle" dominant-baseline="central">M</text><circle class="dg-pt" cx="108.5" cy="97" r="2.8"/><text class="dg-lbl-math" x="120.5" y="97" text-anchor="middle" dominant-baseline="central">N</text><path class="dg-geo" d="M180 30L252 138"/><path class="dg-geo" d="M280 30L172 138"/><path class="dg-geo" d="M180 30L280 30"/><path class="dg-curve" d="M252 138L172 138"/><circle class="dg-pt" cx="220" cy="90" r="2.8"/><text class="dg-lbl-math" x="232" y="90" text-anchor="middle" dominant-baseline="central">A</text><circle class="dg-pt" cx="180" cy="30" r="2.8"/><text class="dg-lbl-math" x="170" y="20" text-anchor="middle" dominant-baseline="central">B</text><circle class="dg-pt" cx="280" cy="30" r="2.8"/><text class="dg-lbl-math" x="290" y="20" text-anchor="middle" dominant-baseline="central">C</text><circle class="dg-pt" cx="252" cy="138" r="2.8"/><text class="dg-lbl-math" x="262" y="149" text-anchor="middle" dominant-baseline="central">M</text><circle class="dg-pt" cx="172" cy="138" r="2.8"/><text class="dg-lbl-math" x="162" y="149" text-anchor="middle" dominant-baseline="central">N</text><text class="dg-lbl-sm" x="150" y="190" text-anchor="middle" dominant-baseline="central">(MN) // (BC) : AM/AB = AN/AC = MN/BC</text></svg>
