<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 286" width="300" height="286" role="img" aria-label="Niveaux d’énergie de l’atome d’hydrogène, En = −13,6/n² eV : en retombant vers le niveau 1, l’atome émet les raies de Lyman (ultraviolet) ; vers le niveau 2, celles de Balmer (visibles)."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-dash{fill: none; stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 4 4;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-curve,.dg-curve-alt,.dg-curve-3{fill: none; stroke: #1d4ed8; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;}.dg-curve-3{stroke: #12b76a;}.dg-vec,.dg-ray,.dg-object-line,.dg-image-line,.dg-image-virtual,.dg-ray-virtual{fill: none; stroke: #e31b23; stroke-width: 2.2; stroke-linecap: round;}.dg-vec-head,.dg-object-head{fill: #e31b23;}.dg-green-fill{fill: #12b76a;}</style><path class="dg-ink" d="M60 270L230 270"/><text class="dg-lbl-xs" x="56" y="270" text-anchor="end" dominant-baseline="central">n = 1</text><text class="dg-tick" x="234" y="270" text-anchor="start" dominant-baseline="central">−13,6 eV</text><path class="dg-ink" d="M60 82.5L230 82.5"/><text class="dg-lbl-xs" x="56" y="82.5" text-anchor="end" dominant-baseline="central">n = 2</text><text class="dg-tick" x="234" y="82.5" text-anchor="start" dominant-baseline="central">−3,4 eV</text><path class="dg-ink" d="M60 47.8L230 47.8"/><text class="dg-lbl-xs" x="56" y="47.8" text-anchor="end" dominant-baseline="central">n = 3</text><text class="dg-tick" x="234" y="47.8" text-anchor="start" dominant-baseline="central">−1,51 eV</text><path class="dg-ink" d="M60 35.6L230 35.6"/><text class="dg-lbl-xs" x="56" y="35.6" text-anchor="end" dominant-baseline="central">n = 4</text><text class="dg-tick" x="234" y="35.6" text-anchor="start" dominant-baseline="central">−0,85 eV</text><path class="dg-dash" d="M60 20L230 20"/><text class="dg-lbl-xs" x="56" y="20" text-anchor="end" dominant-baseline="central">n = ∞</text><text class="dg-tick" x="234" y="20" text-anchor="start" dominant-baseline="central">0 eV</text><path class="dg-vec" d="M80 82.5L80 263.8"/><path class="dg-vec-head" d="M80 268L77.1 261.6L82.9 261.6Z"/><path class="dg-vec" d="M94 47.8L94 263.8"/><path class="dg-vec-head" d="M94 268L91.1 261.6L96.9 261.6Z"/><path class="dg-vec" d="M108 35.6L108 263.8"/><path class="dg-vec-head" d="M108 268L105.1 261.6L110.9 261.6Z"/><path class="dg-curve-3" d="M150 47.8L150 76.3"/><path class="dg-green-fill" d="M150 80.5L147.1 74.1L152.9 74.1Z"/><path class="dg-curve-3" d="M164 35.6L164 76.3"/><path class="dg-green-fill" d="M164 80.5L161.1 74.1L166.9 74.1Z"/><text class="dg-lbl-xs" x="94" y="256" text-anchor="middle" dominant-baseline="central">Lyman (UV)</text><text class="dg-lbl-xs" x="164" y="94.5" text-anchor="middle" dominant-baseline="central">Balmer (visible)</text></svg>
