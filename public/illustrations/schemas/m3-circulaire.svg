<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 204" width="300" height="204" role="img" aria-label="Diagramme circulaire : une modalité de fréquence 25 % occupe un secteur de 90° (0,25 × 360°) ; 50 % occupe 180°."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-blue{fill: #eff8ff; stroke: #175cd3;}.dg-t-yellow{fill: #fffaeb; stroke: #b54708;}.dg-t-green{fill: #f0fdf4; stroke: #15803d;}</style><path class="dg-t-blue" d="M100 100L100 24A76 76 0 0 1 100 176Z"/><rect class="dg-t-blue" x="196" y="50" width="14" height="14"/><text class="dg-lbl-xs" x="216" y="57" text-anchor="start" dominant-baseline="central">50 % : 180°</text><path class="dg-t-red" d="M100 100L100 176A76 76 0 0 1 24 100.00000000000001Z"/><rect class="dg-t-red" x="196" y="74" width="14" height="14"/><text class="dg-lbl-xs" x="216" y="81" text-anchor="start" dominant-baseline="central">25 % : 90°</text><path class="dg-t-yellow" d="M100 100L24 100.00000000000001A76 76 0 0 1 55.32832082577203 38.514708427504004Z"/><rect class="dg-t-yellow" x="196" y="98" width="14" height="14"/><text class="dg-lbl-xs" x="216" y="105" text-anchor="start" dominant-baseline="central">15 % : 54°</text><path class="dg-t-green" d="M100 100L55.32832082577203 38.514708427504004A76 76 0 0 1 99.99999999999999 24Z"/><rect class="dg-t-green" x="196" y="122" width="14" height="14"/><text class="dg-lbl-xs" x="216" y="129" text-anchor="start" dominant-baseline="central">10 % : 36°</text><text class="dg-lbl-sm" x="150" y="194" text-anchor="middle" dominant-baseline="central">angle = fréquence × 360°</text></svg>
