<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 196" width="300" height="196" role="img" aria-label="Dents d’un herbivore et d’un carnivore (schéma) : le mouton a des incisives coupantes, pas de canines et de larges molaires ; le chien a de longues canines pointues et des dents tranchantes."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-head-cell,.dg-cell,.dg-cell-hi{fill: #f5f7f9; stroke: #101828; stroke-width: 1;}.dg-cell{fill: #ffffff;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-pink{fill: #fff4ed; stroke: #f97316;}</style><text class="dg-lbl-sm" x="150" y="14" text-anchor="middle" dominant-baseline="central">herbivore (mouton)</text><rect class="dg-t-pink" x="10" y="54" width="280" height="12" rx="4"/><rect class="dg-cell" x="16" y="34" width="9" height="20" rx="2"/><rect class="dg-cell" x="27" y="34" width="9" height="20" rx="2"/><rect class="dg-cell" x="38" y="34" width="9" height="20" rx="2"/><path class="dg-cell" d="M140 54V36l5 -4 5 4 5 -4 5 4 5 -4 5 4V54Z"/><path class="dg-cell" d="M170 54V36l5 -4 5 4 5 -4 5 4 5 -4 5 4V54Z"/><path class="dg-cell" d="M200 54V36l5 -4 5 4 5 -4 5 4 5 -4 5 4V54Z"/><path class="dg-cell" d="M230 54V36l5 -4 5 4 5 -4 5 4 5 -4 5 4V54Z"/><path class="dg-cell" d="M260 54V36l5 -4 5 4 5 -4 5 4 5 -4 5 4V54Z"/><path class="dg-leader" d="M30 54L42 73"/><circle class="dg-pt" cx="30" cy="54" r="1.8"/><text class="dg-lbl-xs" x="42" y="80" text-anchor="middle" dominant-baseline="central">incisives</text><path class="dg-leader" d="M96 60L110 87"/><circle class="dg-pt" cx="9