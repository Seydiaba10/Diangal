<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 206" width="300" height="206" role="img" aria-label="Électrolyse d’une solution de sulfate de cuivre : l’anode, reliée au pôle + du générateur, est le siège d’une oxydation ; à la cathode, reliée au pôle −, les ions cuivre sont réduits et du cuivre se dépose."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl{fill: currentColor; font-size: 13px; font-weight: 600;}.dg-lbl-sm{fill: currentColor; font-size: 11.5px; font-weight: 500;}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-wire,.dg-wire-bold{fill: none; stroke: #101828; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round;}.dg-comp{fill: #ffffff; stroke: #101828; stroke-width: 1.7;}.dg-t-red,.dg-t-blue,.dg-t-yellow,.dg-t-green,.dg-t-pink,.dg-t-sand,.dg-t-violet,.dg-t-grey{stroke-width: 1.5; stroke-linejoin: round;}.dg-t-red{fill: #fdecec; stroke: #b42318;}.dg-t-grey{fill: #f5f7f9; stroke: #667085;}.dg-sol-copper{fill: #2e90fa; opacity: 0.35;}.dg-copper-deposit{fill: #c2410c;}.dg-glass,.dg-bottle{fill: none; stroke: #101828; stroke-width: 2; stroke-linejoin: round;}</style><path class="dg-glass" d="M60 60V170Q60 180 70 180H230Q240 180 240 170V60"/><rect class="dg-sol-copper" x="62" y="90" width="176" height="88"/><rect class="dg-t-grey" x="96" y="40" width="12" height="120"/><rect class="dg-t-red" x="192" y="40" width="12" height="120"/><rect class="dg-copper-deposit" x="190" y="110" width="16" height="50"/><path class="dg-wire" d="M102 40L102 14L130 14"/><rect class="dg-comp" x="130" y="4" width="40" height="20" rx="3"/><text class="dg-lbl-sm" x="150" y="14" text-anchor="middle" dominant-baseline="central">G</text><path class="dg-wire" d="M170 14L198 14L198 40"/><text class="dg-lbl" x="126" y="32" text-anchor="middle" dominant-baseline="central">+</text><text class="dg-lbl" x="174" y="32" text-anchor="middle" dominant-baseline="central">−</text><path class="dg-leader" d="M102 70L66.5 60"/><circle class="dg-pt" cx="102" cy="70" r="1.8"/><text class="dg-lbl-xs" x="64.5" y="54" text-anchor="end" dominant-baseline="central">anode (+) :</text><text class="dg-lbl-xs" x="64.5" y="66" text-anchor="end" dominant-baseline="central">oxydation</text><path class="dg-leader" d="M198 70L222.5 60"/><circle class="dg-pt" cx="198" cy="70" r="1.8"/><text class="dg-lbl-xs" x="224.5" y="54" text-anchor="start" dominant-baseline="central">cathode (−) :</text><text class="dg-lbl-xs" x="224.5" y="66" text-anchor="start" dominant-baseline="central">réduction</text><path class="dg-leader" d="M206 140L250 150"/><circle class="dg-pt" cx="206" cy="140" r="1.8"/><text class="dg-lbl-xs" x="252" y="144" text-anchor="start" dominant-baseline="central">dépôt de</text><text class="dg-lbl-xs" x="252" y="156" text-anchor="start" dominant-baseline="central">cuivre</text><text class="dg-lbl-sm" x="150" y="196" text-anchor="middle" dominant-baseline="central">Q = I × t ; n(e⁻) = Q ÷ F</text></svg>
