<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 126" width="300" height="126" role="img" aria-label="Frise des grandes périodes : la Préhistoire jusqu’à l’invention de l’écriture vers −3000, l’Antiquité jusqu’en 476, le Moyen Âge jusqu’en 1492, les Temps modernes jusqu’en 1789, puis l’époque contemporaine."><style>svg{color:#101828;font-family:Lexend,Arial,sans-serif}.dg-lbl-xs{fill: currentColor; font-size: 10px; font-weight: 500;}.dg-tick{fill: #667085; font-size: 10.5px; font-weight: 500;}.dg-ink,.dg-ink-thin,.dg-leader,.dg-axis-line{fill: none; stroke: #101828; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;}.dg-ink-thin,.dg-axis-line{stroke-width: 1.1;}.dg-leader{stroke: #667085; stroke-width: 0.9;}.dg-pt{fill: #101828;}.dg-period,.dg-period-alt{fill: #fffaeb; stroke: #b54708; stroke-width: 1;}.dg-period-alt{fill: #eff8ff; stroke: #175cd3;}</style><rect class="dg-period" x="16" y="67" width="44.7" height="10"/><path class="dg-leader" d="M38.3 67L38.3 58"/><text class="dg-lbl-xs" x="38.3" y="52" text-anchor="middle" dominant-baseline="central">Préhistoire</text><rect class="dg-period-alt" x="60.7" y="67" width="155.3" height="10"/><path class="dg-leader" d="M138.3 67L138.3 58"/><text class="dg-lbl-xs" x="138.3" y="52" text-anchor="middle" dominant-baseline="central">Antiquité</text><rect class="dg-period" x="215.9" y="67" width="45.4" height="10"/><path class="dg-leader" d="M238.6 67L238.6 58"/><text class="dg-lbl-xs" x="238.6" y="52" text-anchor="middle" dominant-baseline="central">Moyen Âge</text><rect class="dg-period-alt" x="261.3" y="67" width="13.3" height="10"/><path class="dg-leader" d="M267.9 67L256.8 42"/><text class="dg-lbl-xs" x="256.8" y="36" text-anchor="middle" dominant-baseline="central">Temps modernes</text><rect class="dg-period" x="274.6" y="67" width="9.4" height="10"/><path class="dg-leader" d="M279.3 67L240 26"/><text class="dg-lbl-xs" x="240" y="20" text-anchor="middle" dominant-baseline="central">Époque contemporaine</text><path class="dg-axis-line" d="M10 72L291.8 72"/><path class="dg-pt" d="M296 72L289.6 74.9L289.6 69.1Z"/><path class="dg-axis-line" d="M16 68L16 76"/><text class="dg-tick" x="16" y="85" text-anchor="middle" dominant-baseline="central">−4000</text><path class="dg-axis-line" d="M60.7 68L60.7 76"/><text class="dg-tick" x="60.7" y="85" text-anchor="middle" dominant-baseline="central">−3000</text><path class="dg-axis-line" d="M105.3 68L105.3 76"/><text class="dg-tick" x="105.3" y="85" text-anchor="middle" dominant-baseline="central">−2000</text><path class="dg-axis-line" d="M150 68L150 76"/><text class="dg-tick" x="150" y="85" text-anchor="middle" dominant-baseline="central">−1000</text><path class="dg-axis-line" d="M194.7 68L194.7 76"/><text class="dg-tick" x="194.7" y="85" text-anchor="middle" dominant-baseline="central">0</text><path class="dg-axis-line" d="M239.3 68L239.3 76"/><text class="dg-tick" x="239.3" y="85" text-anchor="middle" dominant-baseline="central">1000</text><path class="dg-axis-line" d="M284 68L284 76"/><text class="dg-tick" x="284" y="85" text-anchor="middle" dominant-baseline="central">2000</text><path class="dg-leader" d="M60.7 72L60.7 98"/><circle class="dg-pt" cx="60.7" cy="72" r="3"/><text class="dg-lbl-xs" x="60.7" y="104" text-anchor="middle" dominant-baseline="central">écriture</text><path class="dg-leader" d="M215.9 72L215.9 98"/><circle class="dg-pt" cx="215.9" cy="72" r="3"/><text class="dg-lbl-xs" x="215.9" y="104" text-anchor="middle" dominant-baseline="central">fin de l’Empire romain</text><path class="dg-leader" d="M261.3 72L242.8 113"/><circle class="dg-pt" cx="261.3" cy="72" r="3"/><text class="dg-lbl-xs" x="242.8" y="119" text-anchor="middle" dominant-baseline="central">arrivée en Amérique</text></svg>
