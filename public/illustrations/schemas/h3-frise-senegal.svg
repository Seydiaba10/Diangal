xt class="dg-tick" x="173.6" y="53" text-anchor="middle" dominant-baseline="central">1954</text><path class="dg-axis-line" d="M205.2 36L205.2 44"/><text class="dg-tick" x="205.2" y="53" text-anchor="middle" dominant-baseline="central">1956</text><path class="dg-axis-line" d="M236.7 36L236.7 44"/><text class="dg-tick" x="236.7" y="53" text-anchor="middle" dominant-baseline="central">1958</text><path class="dg-axis-line" d="M268.2 36L268.2 44"/><text class="dg-tick" x="268.2" y="53" text-anchor="middle" dominant-baseline="central">1960</text><path class="dg-leader" d="M16 40L54.4 66"/><circle class="dg-pt" cx="16" cy="40" r="3"/><text class="dg-lbl-xs" x="54.4" y="72" text-anchor="middle" dominant-baseline="central">1944 : Brazzaville</text><path class="dg-leader" d="M47.5 40L127.2 81"/><circle class="dg-pt" cx="47.5" cy="40" r="3"/><text class="dg-lbl-xs" x="127.2" y="87" text-anchor="middle" dominant-baseline="central">1946 : lois Lamine Guèye et Houphouët-Boigny</text><path class="dg-leader" d="M79.1 40L79.1 96"/><circle class="dg-pt" cx="79.1" cy="40" r="3"/><text class="dg-lbl-xs" x="79.1" y="102" text-anchor="middle" dominant-baseline="central">1948 : BDS</text><path class="dg-leader" d="M205.2 40L205.2 66"/><circle class="dg-pt" cx="205.2" cy="40" r="3"/><text class="dg-lbl-xs" x="205.2" y="72" text-anchor="middle" dominant-baseline="central">1956 : loi-cadre</text><path class="dg-leader" d="M248.4 40L248.4 96"/><circle class="dg-pt" cx="248.4" cy="40" r="3"/><text class="dg-lbl-xs" x="248.4" y="102" text-anchor="middle" dominant-baseline="central">1958 : référendum</text><path class="dg-leader" d="M278.2 40L220.4 111"/><circle class="dg-pt" cx="278.2" cy="40" r="3"/><text class="dg-lbl-xs" x="220.4" y="117" text-anchor="middle" dominant-baseline="central">20 août 1960 : indépendance</text></svg>
